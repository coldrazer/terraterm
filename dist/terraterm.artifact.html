<title>TERRATERM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="TERRATERM tracks crude oil prices and watches storage tanks at Cushing, Oklahoma from satellite photos, lined up with the weekly government inventory report, so you can check prices against what is physically in the yard.">
<style>
/* TERRATERM design tokens · blueprint §5
   Layout: fixed frame (top 40 / function bar 32 / main grid / status 28), 3x2 desk grid with 1px gutters.
   Dark only by decision (§19.1). Every color in the app reads from these tokens. */
:root {
  color-scheme: dark;

  /* surfaces */
  --bg: #0a0a0b;
  --panel: #111113;
  --raised: #161618;
  --gutter: #232326;
  --rule: #1a1a1d;
  --imagery-bg: #060607;
  --scrim: rgba(0, 0, 0, 0.62);
  --hud-bg: rgba(10, 10, 11, 0.82);

  /* text */
  --text: #e8e6e1;
  --text-2: #8a8a8e;

  /* identity and semantics */
  --amber: #ff9f1c;      /* brand, focus, action */
  --amber-dim: #7a4d0e;
  --amber-wash: rgba(255, 159, 28, 0.10);
  --up: #00d97e;         /* price direction only */
  --down: #ff4d5e;       /* price direction, alerts, feed down */
  --info: #4da6ff;       /* info and links */
  --geo: #2dd4bf;        /* physical world */
  --up-flash: rgba(0, 217, 126, 0.12);
  --down-flash: rgba(255, 77, 94, 0.12);
  --user-bubble: #11233a;
  --user-bubble-edge: #1d3a5e;
  --on-amber: #0a0a0b;

  /* segment classes §11 */
  --cls-logistics: #2dd4bf;
  --cls-energy: #ff9f1c;
  --cls-maritime: #4da6ff;
  --cls-industrial: #a78bfa;

  /* chart series: muted, never green or red */
  --s1: #e8e6e1;
  --s2: #f4a259;
  --s3: #b39dff;
  --s4: #7cc4ff;
  --s5: #5eead4;
  --s6: #f9a8d4;

  /* type */
  --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs-base: 12px;
  --lh: 1.5;
  --fs-title: 11px;
  --fs-label: 10px;
  --fs-tag: 9px;
  --fs-tip: 11px;
  --fs-kpi: 19px;
  --track-title: 1.5px;

  /* space and shape */
  --u: 8px;
  --pad: 10px;
  --r-card: 6px;
  --r-tag: 3px;
  --r-bubble: 8px;

  /* frame */
  --h-top: 40px;
  --h-fbar: 32px;
  --h-tape: 22px;
  --h-status: 28px;
  --h-head: 34px;
  --h-row: 22px;
  --col-l: 300px;
  --col-r: 340px;
  --row-b: 220px;
  --edge: max(16px, env(safe-area-inset-left, 0px));
  --edge-r: max(16px, env(safe-area-inset-right, 0px));

  /* motion */
  --t-fast: 150ms;
  --t-modal: 250ms;
  --t-flash: 400ms;
}

/* TERRATERM app styles · built only from tokens.css */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: var(--fs-base)/var(--lh) var(--font-mono);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
select { background: var(--bg); border: 1px solid var(--gutter); border-radius: var(--r-card); height: 26px; padding: 0 6px; }
a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
kbd { font: inherit; font-size: 10px; border: 1px solid var(--gutter); border-radius: var(--r-tag); padding: 0 4px; line-height: 14px; color: var(--text-2); background: var(--bg); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--text-2); }
.muted { color: var(--text-2); }
.amber { color: var(--amber); }
.geo { color: var(--geo); }
.info { color: var(--info); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow { flex: 1; min-width: 0; }

/* ---------- frame ---------- */
#app {
  height: 100%;
  display: grid;
  grid-template-rows: var(--h-top) var(--h-fbar) auto minmax(0, 1fr) var(--h-status);
  grid-template-columns: minmax(0, 1fr);
}
#app > .topbar { grid-row: 1; }
#app > .fbar { grid-row: 2; }
#app > .tape { grid-row: 3; }
#app > main { grid-row: 4; }
#app > .status { grid-row: 5; }
.topbar {
  display: flex; align-items: center; gap: 20px; min-width: 0;
  padding-left: var(--edge); padding-right: var(--edge-r);
  background: var(--panel); border-bottom: 1px solid var(--amber);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 2.5px; font-size: 13px; white-space: nowrap; color: var(--text); }
.brand:hover { text-decoration: none; color: var(--amber); }
.brand svg { display: block; }
.org { color: var(--text-2); font-size: var(--fs-title); letter-spacing: var(--track-title); text-transform: uppercase; white-space: nowrap; }
.badge { font-size: var(--fs-tag); letter-spacing: 1px; font-weight: 700; padding: 1px 6px; border-radius: var(--r-tag); border: 1px solid var(--amber); color: var(--amber); text-transform: uppercase; }
.mkt { display: flex; align-items: center; gap: 6px; font-size: var(--fs-title); letter-spacing: 1px; white-space: nowrap; }
.mkt.open { color: var(--amber); }
.mkt.closed { color: var(--text-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.models { display: flex; gap: 14px; margin-left: auto; min-width: 0; }
.model { display: flex; gap: 6px; align-items: center; font-size: var(--fs-title); color: var(--text-2); white-space: nowrap; }
.model b { color: var(--text); font-weight: 600; }
.st-ok { color: var(--info); }
.st-warn { color: var(--amber); }
.st-down { color: var(--down); }
.clock { font-weight: 700; letter-spacing: 1px; white-space: nowrap; }

.fbar {
  display: flex; align-items: stretch; gap: 1px; min-width: 0;
  padding-left: var(--edge); padding-right: var(--edge-r);
  background: var(--bg); border-bottom: 1px solid var(--gutter);
  overflow-x: auto; scrollbar-width: none;
}
.fbar::-webkit-scrollbar { display: none; }
.fbar a {
  display: flex; align-items: center; gap: 7px; padding: 0 12px;
  color: var(--text-2); font-size: var(--fs-title); letter-spacing: 1.2px; text-transform: uppercase; white-space: nowrap;
  transition: color var(--t-fast) ease, background-color var(--t-fast) ease;
}
.fbar a:hover { color: var(--text); background: var(--raised); text-decoration: none; }
.fbar a[aria-current="page"] { color: var(--on-amber); background: var(--amber); font-weight: 700; }
.fbar a[aria-current="page"] kbd { color: var(--on-amber); border-color: var(--on-amber); background: transparent; }
.fbar .fb-count { color: inherit; font-weight: 700; }

.tape { height: var(--h-tape); overflow: hidden; border-bottom: 1px solid var(--gutter); background: var(--bg); font-size: var(--fs-title); white-space: nowrap; position: relative; }
.tape-track { display: inline-flex; align-items: center; height: 100%; animation: tape 70s linear infinite; }
.tape-group { display: inline-flex; gap: 28px; padding-left: var(--edge); padding-right: 28px; align-items: center; height: 100%; }
.tape-item b { color: var(--text); margin-right: 6px; }
.tape:hover .tape-track { animation-play-state: paused; }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }

main#main { position: relative; min-height: 0; min-width: 0; padding: 8px var(--edge-r) 8px var(--edge); }
.view { height: 100%; min-height: 0; position: relative; }
.view:focus-visible { outline: none; }

.status {
  display: flex; align-items: center; gap: 16px; min-width: 0;
  padding-left: var(--edge); padding-right: var(--edge-r);
  background: var(--panel); border-top: 1px solid var(--gutter);
  font-size: var(--fs-title); color: var(--text-2); white-space: nowrap; overflow: hidden;
}
.sb { display: flex; align-items: center; gap: 6px; }
.sb b { color: var(--text); font-weight: 600; }
.sb.alerts-on b { color: var(--down); }
.sb-hints { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.sb-mode { color: var(--amber); letter-spacing: 1px; }
.ctx-mini { width: 60px; height: 4px; background: var(--gutter); border-radius: 2px; overflow: hidden; }
.ctx-mini > i { display: block; height: 100%; background: var(--info); }
.ctx-mini.warn > i { background: var(--amber); }
.ctx-mini.crit > i { background: var(--down); }

/* ---------- desk grid ---------- */
.desk {
  height: 100%; position: relative;
  display: grid; gap: 1px; background: var(--gutter); border: 1px solid var(--gutter);
  grid-template-columns: var(--col-l) minmax(0, 1fr) var(--col-r);
  grid-template-rows: minmax(0, 1fr) var(--row-b);
}
.desk > .panel { order: var(--slot, 0); }
.rz { position: absolute; z-index: 5; background: transparent; touch-action: none; }
.rz:hover, .rz.dragging, .rz:focus-visible { background: var(--amber-dim); outline: none; }
.rz-c1 { top: 0; bottom: 0; width: 7px; left: calc(var(--col-l) - 3px); cursor: col-resize; }
.rz-c2 { top: 0; bottom: 0; width: 7px; right: calc(var(--col-r) - 3px); cursor: col-resize; }
.rz-r { left: 0; right: 0; height: 7px; bottom: calc(var(--row-b) - 3px); cursor: row-resize; }
.panel.drop-target { box-shadow: inset 0 0 0 2px var(--amber); }
.panel.dragging { opacity: 0.55; }

/* ---------- panel ---------- */
.panel { background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
.ph {
  height: var(--h-head); flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 10px; border-bottom: 1px solid var(--gutter); min-width: 0;
}
.ph[draggable="true"] { cursor: grab; }
.pt { font-size: var(--fs-title); text-transform: uppercase; letter-spacing: var(--track-title); font-weight: 700; white-space: nowrap; }
.ps { color: var(--text-2); font-size: var(--fs-label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; text-align: right; }
.pa { display: flex; gap: 4px; align-items: center; flex: none; }
.pb { flex: 1; min-height: 0; overflow: auto; position: relative; }
.pb.noscroll { overflow: hidden; display: flex; flex-direction: column; }
.sh {
  height: 28px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  border-top: 1px solid var(--gutter); border-bottom: 1px solid var(--gutter); background: var(--panel); min-width: 0;
}
.sh .pt { font-size: var(--fs-label); }
.ribbon {
  flex: none; font-size: var(--fs-label); letter-spacing: 1px; color: var(--amber);
  background: var(--amber-wash); border-bottom: 1px solid var(--amber-dim); padding: 2px 10px; text-transform: uppercase;
}
.panel-error { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--gutter); color: var(--text); flex: none; }
.panel-error .dot { color: var(--down); }
.empty { padding: 18px 12px; color: var(--text-2); text-align: center; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 24px; padding: 0 9px; border: 1px solid var(--gutter); border-radius: var(--r-card);
  background: var(--raised); color: var(--text); font-size: var(--fs-label); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
  transition: border-color var(--t-fast) ease, color var(--t-fast) ease;
}
.btn:hover { border-color: var(--text-2); }
.btn[aria-pressed="true"], .btn.on { border-color: var(--amber); color: var(--amber); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-amber { background: var(--amber); color: var(--on-amber); border-color: var(--amber); font-weight: 700; }
.btn-amber:hover { border-color: var(--text); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { color: var(--text); border-color: var(--gutter); }
.btn-lg { height: 30px; padding: 0 14px; font-size: var(--fs-title); }
.seg-ctl { display: inline-flex; border: 1px solid var(--gutter); border-radius: var(--r-card); overflow: hidden; }
.seg-ctl button { height: 22px; padding: 0 8px; font-size: var(--fs-label); letter-spacing: 1px; color: var(--text-2); border-right: 1px solid var(--gutter); }
.seg-ctl button:last-child { border-right: 0; }
.seg-ctl button[aria-pressed="true"] { color: var(--on-amber); background: var(--amber); font-weight: 700; }
.input {
  background: var(--bg); border: 1px solid var(--gutter); border-radius: var(--r-card); height: 28px; padding: 0 10px; min-width: 0;
}
.input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: -1px; border-color: transparent; }
.tag {
  display: inline-block; font-size: var(--fs-tag); letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
  padding: 0 5px; line-height: 14px; border-radius: var(--r-tag); border: 1px solid currentColor; white-space: nowrap; flex: none;
}
.tag.macro { color: var(--amber); }
.tag.geo { color: var(--geo); }
.tag.alert { color: var(--down); }
.tag.info { color: var(--info); }
.tag.sev-high { color: var(--down); }
.tag.sev-med { color: var(--amber); }
.tag.sev-low { color: var(--info); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px;
  border: 1px solid var(--gutter); background: var(--raised); font-size: var(--fs-label); color: var(--text); white-space: nowrap;
}
.chip:hover { border-color: var(--text-2); }
.chip .x { color: var(--text-2); }
.chip.ctx { border-color: var(--amber-dim); }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; background: currentColor; }
.tri { font-size: 9px; }

/* ---------- tables ---------- */
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl th {
  position: sticky; top: 0; z-index: 2; background: var(--panel);
  font-size: var(--fs-label); letter-spacing: 1px; text-transform: uppercase; color: var(--text-2); font-weight: 600;
  text-align: left; padding: 0 8px; height: 24px; border-bottom: 1px solid var(--gutter); white-space: nowrap; overflow: hidden;
}
.tbl th.num { text-align: right; }
.tbl th button { width: 100%; height: 100%; text-align: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; display: block; }
.tbl th[aria-sort="ascending"], .tbl th[aria-sort="descending"] { color: var(--amber); }
.tbl td { height: var(--h-row); padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--rule); }
.tbl tr.row { cursor: pointer; }
.tbl tr.row:hover td { background: var(--raised); }
.tbl tr.row.sel td { background: var(--amber-wash); }
.tbl tr.row.ctx td:first-child { box-shadow: inset 2px 0 0 var(--amber); }
.tbl td.flash-up { background: var(--up-flash) !important; }
.tbl td.flash-down { background: var(--down-flash) !important; }
.tbl td.sym { font-weight: 700; }
.tbl td.spark { padding: 0 6px; }
.tbl td.spark svg { display: block; }
.tbl .pin { color: var(--text-2); width: 100%; height: 100%; }
.tbl .pin.on { color: var(--amber); }
.skel td span { display: block; height: 8px; border-radius: 2px; background: linear-gradient(90deg, var(--raised), var(--gutter), var(--raised)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.tbl-wrap { overflow: auto; min-height: 0; flex: 1; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--gutter); border-bottom: 1px solid var(--gutter); flex: none; }
.kpi { background: var(--panel); padding: 7px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; transition: background-color var(--t-fast) ease; }
button.kpi:hover { background: var(--raised); }
.kpi .k-l { font-size: var(--fs-label); letter-spacing: 1px; text-transform: uppercase; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .k-v { font-size: var(--fs-kpi); font-weight: 700; line-height: 1.25; white-space: nowrap; }
.kpi .k-c { font-size: var(--fs-title); white-space: nowrap; }
.kpi-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.kpi-grid .kpi { border: 1px solid var(--gutter); border-radius: var(--r-card); background: var(--raised); padding: 10px 12px; }

/* ---------- wire / timeline lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.wire-item { border-bottom: 1px solid var(--rule); }
.wire-item > button { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; align-items: center; width: 100%; padding: 4px 10px; min-height: 26px; }
.wire-item > button:hover { background: var(--raised); }
.wire-item .t { color: var(--text-2); }
.wire-item.new > button { background: var(--amber-wash); }
.wire-more { padding: 2px 10px 8px 10px; color: var(--text-2); font-size: var(--fs-title); display: grid; gap: 4px; }
.wire-more .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.tl-item { display: grid; grid-template-columns: 62px auto minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 3px 10px; border-bottom: 1px solid var(--rule); }
.tl-item .t { color: var(--text-2); }
.tl-item button.trunc { text-align: left; }
.tl-item button.trunc:hover { color: var(--amber); }

/* ---------- agent ---------- */
.chat { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.ctxbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--gutter); flex: none; min-height: 34px; }
.ctxbar .lbl { font-size: var(--fs-label); letter-spacing: 1px; color: var(--text-2); }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 94%; border-radius: var(--r-bubble); padding: 8px 10px; line-height: 1.5; overflow-wrap: anywhere; }
.msg p { margin: 0 0 6px 0; }
.msg p:last-child { margin-bottom: 0; }
.msg.user { align-self: flex-end; background: var(--user-bubble); border: 1px solid var(--user-bubble-edge); }
.msg.agent { align-self: flex-start; background: var(--raised); border: 1px solid var(--gutter); }
.msg.system { align-self: center; border: 1px dashed var(--amber-dim); color: var(--text-2); font-size: var(--fs-title); max-width: 100%; text-align: center; }
.msg.system b { color: var(--amber); }
.msg .who { font-size: var(--fs-label); color: var(--text-2); letter-spacing: 0.5px; margin-bottom: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.msg .who .name { color: var(--amber); font-weight: 700; letter-spacing: 1px; }
.msg .foot { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--gutter); font-size: var(--fs-title); color: var(--text-2); display: grid; gap: 3px; }
.msg .foot .k { letter-spacing: 1px; text-transform: uppercase; font-size: var(--fs-label); margin-right: 6px; }
.msg .foot b { color: var(--text); }
.msg .foot button.src { color: var(--info); }
.msg .foot button.src:hover { text-decoration: underline; }
.msg .reasoning { color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.msg .reasoning .dot { color: var(--amber); }
.msg .err { color: var(--text); display: flex; gap: 10px; align-items: center; }
.caret::after { content: "▍"; color: var(--amber); animation: pulse 1s steps(2) infinite; }
.prompts { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 10px 0 10px; flex: none; }
.composer { display: flex; gap: 6px; padding: 8px 10px; flex: none; }
.composer .input { flex: 1; height: 30px; }
.composer .btn-amber { height: 30px; padding: 0 14px; border-radius: var(--r-card); font-size: var(--fs-title); letter-spacing: 1px; }
.viewonly { padding: 8px 10px; color: var(--text-2); border-top: 1px solid var(--gutter); flex: none; display: none; }

/* ---------- orbital ---------- */
.orb-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.orb { position: relative; flex: 1; min-height: 120px; background: var(--imagery-bg); overflow: hidden; }
.orb canvas.view-canvas { position: absolute; inset: 0; display: block; }
.orb.hovering canvas.view-canvas { cursor: pointer; }
.orb-hud {
  position: absolute; top: 8px; left: 8px; z-index: 3; pointer-events: none;
  background: var(--hud-bg); border: 1px solid var(--gutter); border-radius: var(--r-tag);
  padding: 4px 8px; font-size: var(--fs-label); line-height: 1.55; letter-spacing: 0.4px; max-width: calc(100% - 16px);
}
.orb-hud .k { color: var(--text-2); display: inline-block; min-width: 38px; }
.orb-hud .site { color: var(--geo); font-weight: 700; letter-spacing: 1px; }
.orb-labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.hud-label {
  position: absolute; pointer-events: auto; display: flex; gap: 6px; align-items: center;
  background: var(--hud-bg); border: 1px solid currentColor; border-radius: var(--r-tag);
  font-size: var(--fs-label); line-height: 16px; padding: 0 6px; white-space: nowrap; letter-spacing: 0.5px;
}

/* ---- js/mock/market.js ---- */
/* Scaffold market simulation: quotes, histories for 1D/1W/1M/1Y, futures and FX tables, capital flow. */
(function () {
  'use strict';
  const TT = window.TT;
  const D = () => TT.mock.data;
  const MIN = 60000, HOUR = 3600000, DAY = 86400000;
  const TICK_MS = 500;

  function bridge(rnd, from, to, n, sigma, additive) {
    // Random walk of n points from `from` to `to`, pinned at both ends.
    const w = [0];
    for (let k = 1; k < n; k++) w.push(w[k - 1] + TT.gauss(rnd) * sigma);
    const end = w[n - 1];
    return w.map((v, k) => {
      const t = n > 1 ? k / (n - 1) : 1;
      const dev = v - end * t;
      if (additive) return from + (to - from) * t + dev;
      return Math.exp(Math.log(from) + (Math.log(to) - Math.log(from)) * t + dev);
    });
  }

  TT.mock.Market = function (opts) {
    const boot = opts.bootTs;
    const demo = !!opts.demo;
    const rnd = TT.rng(opts.seed || 7);
    const inst = new Map();
    let lastStep = boot;

    // Group B fill deltas drive CL1 daily returns so the agent's correlation is computed, not asserted.
    const seg = TT.mock.scenes.get('ela-segundo-tanks', boot);
    const histB = seg.history.groupB;
    const fillDeltas = histB.slice(1).map((v, k) => v - histB[k]); // 29 deltas, last = latest pass

    D().instruments.forEach((src) => {
      const q = Object.assign({}, src);
      q.anchor = q.px;
      q.open = q.prev + (q.px - q.prev) * 0.25;
      q.hi = Math.max(q.px, q.open, q.prev) * (q.kind === 'yield' ? 1 : 1.0012);
      q.lo = Math.min(q.px, q.open, q.prev) * (q.kind === 'yield' ? 1 : 0.9988);
      if (q.kind === 'yield') { q.hi = Math.max(q.px, q.prev) + 0.008; q.lo = Math.min(q.px, q.prev) - 0.006; }
      q.ts = boot;
      const additive = q.kind === 'yield';
      const dSig = additive ? 0.045 : q.vol / Math.sqrt(252);
      const r = TT.rng(TT.hash(q.sym));
      // daily closes ending at prev (yesterday), 260 trading days
      const daily = [q.prev];
      let dayTs = boot - DAY;
      for (let k = 1; k < 260; k++) {
        let ret;
        if (q.sym === 'CL1' && k <= 28) ret = -0.003 * fillDeltas[fillDeltas.length - 1 - k] + TT.gauss(r) * 0.006;
        else ret = TT.gauss(r) * dSig;
        const prevClose = additive ? daily[0] - ret : daily[0] / Math.exp(ret);
        daily.unshift(prevClose);
      }
      q.daily = daily.map((v, k) => [dayTs - (daily.length - 1 - k) * DAY, v]);
      // weekly hourly path from 5 closes ago to now
      const wFrom = daily[daily.length - 5];
      q.week = bridge(r, wFrom, q.px, 7 * 24 + 1, additive ? 0.006 : dSig / 5, additive).map((v, k) => [boot - (7 * 24 - k) * HOUR, v]);
      // intraday 5-minute path from prev to now
      q.intra = bridge(r, q.prev, q.px, 289, additive ? 0.0015 : dSig / 19, additive).map((v, k) => [boot - (288 - k) * 5 * MIN, v]);
      inst.set(q.sym, q);
    });

    function moveQuote(q, step) {
      const additive = q.kind === 'yield';
      if (demo && q.sym === 'CL1') return false;
      const amp = demo ? 0.6 : 1;
      if (additive) q.px = q.px + TT.gauss(rnd) * 0.0006 * amp + (q.anchor - q.px) * 0.02;
      else {
        const sig = q.vol * Math.sqrt(TICK_MS / (252 * 6.5 * 3600 * 1000)) * 2.5 * amp;
        q.px = q.px * Math.exp(TT.gauss(rnd) * sig) + (q.anchor - q.px) * 0.02;
      }
      q.hi = Math.max(q.hi, q.px); q.lo = Math.min(q.lo, q.px);
      q.ts = step;
      return true;
    }

    function updateSeries(q, now) {
      const lastI = q.intra[q.intra.length - 1];
      if (now - lastI[0] >= 5 * MIN) q.intra.push([now, q.px]); else lastI[1] = q.px;
      const lastW = q.week[q.week.length - 1];
      if (now - lastW[0] >= HOUR) q.week.push([now, q.px]); else lastW[1] = q.px;
    }

    function advance(now) {
      let steps = Math.floor((now - lastStep) / TICK_MS);
      if (steps <= 0) return;
      steps = Math.min(steps, 12);
      for (let s = 0; s < steps; s++) {
        lastStep += TICK_MS;
        inst.forEach((q) => { if (rnd() < 0.35) moveQuote(q, lastStep); });
      }
      lastStep = Math.max(lastStep, now - TICK_MS);
      inst.forEach((q) => updateSeries(q, now));
      advanceTables(now);
    }

    function view(q) {
      const chg = q.px - q.prev;
      return { sym: q.sym, name: q.name, kind: q.kind, px: q.px, prev: q.prev, chg: chg, chgPct: chg / q.prev, hi: q.hi, lo: q.lo, open: q.open, ts: q.ts, spark: q.intra.slice(-48).map((p) => p[1]) };
    }

    function series(sym, tf, now) {
      const q = inst.get(sym);
      if (!q) return [];
      if (tf === '1D') return q.intra.filter((p) => p[0] >= now - DAY - 5 * MIN);
      if (tf === '1W') return q.week.filter((p) => p[0] >= now - 7 * DAY - HOUR);
      const live = [now, q.px];
      if (tf === '1M') return q.daily.slice(-22).concat([live]);
      return q.daily.slice(-252).concat([live]);
    }

    /* ---------- tables ---------- */
    const tables = { commodities: [], fx: [] };
    const tr = TT.rng(TT.hash('tables'));
    D().products.forEach((p) => {
      const [code, pname, base, vol, spread, link] = p;
      const productRet = TT.gauss(tr) * vol / Math.sqrt(252);
      for (let m = 0; m < 8; m++) {
        const mi = (11 + m) % 12, yr = 26 + Math.floor((11 + m) / 12);
        const px = base + spread * m;
        const prev = px * (1 - productRet * (1 - m * 0.04) - TT.gauss(tr) * vol / Math.sqrt(252) * 0.15);
        const row = { sym: code + D().monthCodes[mi] + String(yr).slice(-1), name: pname + ' ' + D().monthNames[mi] + ' ' + yr, product: code, kind: 'commodity', px: px, prev: prev, vol: vol,
          volume: Math.round((8 - m) * (800 + tr() * 9000)), oi: Math.round((9 - m) * (4000 + tr() * 40000)), link: m === 0 ? link : null, spreadFromLink: 0 };
        tables.commodities.push(row);
      }
    });
    const cur = D().currencies;
    const rate = Object.fromEntries(cur);
    const pairs = [];
    const add = (b, q) => { const s = b + q; if (b !== q && !pairs.includes(s) && !pairs.includes(q + b)) pairs.push(s); };
    [['EUR', 'USD'], ['USD', 'JPY'], ['GBP', 'USD'], ['USD', 'CHF'], ['AUD', 'USD'], ['USD', 'CAD'], ['NZD', 'USD']].forEach(([b, q]) => add(b, q));
    cur.forEach(([c]) => add('USD', c));
    ['EUR', 'GBP', 'JPY', 'AUD', 'CHF', 'CAD', 'NZD', 'SEK', 'NOK'].forEach((b) => cur.forEach(([c]) => { if (pairs.length < 200) add(b, c); }));
    pairs.slice(0, 200).forEach((s) => {
      const b = s.slice(0, 3), q = s.slice(3);
      const px = rate[q] / rate[b];
      const vol = ['TRY', 'BRL', 'ZAR', 'MXN', 'COP', 'CLP'].includes(b) || ['TRY', 'BRL', 'ZAR', 'MXN', 'COP', 'CLP'].includes(q) ? 0.14 : 0.08;
      const prev = px * (1 - TT.gauss(tr) * vol / Math.sqrt(252));
      tables.fx.push({ sym: s, name: b + '/' + q, product: b, kind: 'fx', px: px, prev: prev, vol: vol, volume: Math.round(200 + tr() * 9000), oi: null, link: s === 'EURUSD' || s === 'USDJPY' ? s : null });
    });
    [tables.commodities, tables.fx].forEach((list) => list.forEach((row) => {
      const r = TT.rng(TT.hash(row.sym));
      if (row.link && inst.get(row.link)) { const lq = inst.get(row.link); row.px = lq.px; row.prev = lq.prev; }
      row.spark = bridge(r, row.prev, row.px, 30, row.vol / 60, false);
      row.hi = Math.max.apply(null, row.spark); row.lo = Math.min.apply(null, row.spark);
      row.ts = boot; row.sparkTs = boot;
    }));
    let lastTable = boot;
    function advanceTables(now) {
      if (now - lastTable < 1000) return;
      lastTable = now;
      ['commodities', 'fx'].forEach((k) => tables[k].forEach((row) => {
        if (row.link && inst.get(row.link)) { const lq = inst.get(row.link); if (lq.px !== row.px) { row.px = lq.px; row.ts = now; } }
        else if (rnd() < 0.12) {
          if (!(demo && row.product === 'CL')) {
            row.px = row.px * Math.exp(TT.gauss(rnd) * row.vol * 0.0009);
            row.ts = now;
          }
        }
        row.hi = Math.max(row.hi, row.px); row.lo = Math.min(row.lo, row.px);
        if (now - row.sparkTs >= 60000) { row.spark.shift(); row.spark.push(row.px); row.sparkTs = now; } else row.spark[row.spark.length - 1] = row.px;
      }));
    }
    function tableView(kind) {
      return tables[kind].map((r, k) => ({ ord: k, sym: r.sym, name: r.name, product: r.product, kind: r.kind, px: r.px, prev: r.prev, chg: r.px - r.prev, chgPct: (r.px - r.prev) / r.prev, hi: r.hi, lo: r.lo, volume: r.volume, oi: r.oi, spark: r.spark.slice(), ts: r.ts }));
    }
    function rowSeries(sym, now) {
      const all = tables.commodities.concat(tables.fx);
      const row = all.find((r) => r.sym === sym);
      if (!row) return null;
      const r = TT.rng(TT.hash(sym + 'intra'));
      const pts = bridge(r, row.prev, row.px, 97, row.vol / 70, false);
      return { sym: sym, name: row.name, kind: row.kind, points: pts.map((v, k) => [now - (96 - k) * 15 * MIN, v]) };
    }

    /* ---------- capital flow ---------- */
    function flow(now) {
      const cats = D().flowCats;
      const base = { Equities: 820, Energy: 410, Metals: 260, Rates: 640, FX: 520 };
      const end = Math.floor(now / HOUR) * HOUR;
      const t = Array.from({ length: 72 }, (_, k) => end - (71 - k) * HOUR);
      const s = {};
      cats.forEach((c) => {
        const r = TT.rng(TT.hash('flow' + c + Math.floor(boot / HOUR)));
        s[c] = t.map((ts, k) => {
          const h = new Date(ts).getUTCHours();
          const diurnal = h >= 13 && h <= 21 ? 1.25 + 0.35 * Math.sin(((h - 13) / 8) * Math.PI) : h >= 7 && h < 13 ? 0.95 : 0.55;
          let v = base[c] * diurnal * (1 + TT.gauss(r) * 0.11);
          if (c === 'Energy' && k >= 64) v *= 1 + (k - 63) * 0.11;
          if (c === 'Metals' && k >= 66) v *= 1.12;
          return Math.max(20, TT.round(v, 1));
        });
      });
      return { asOf: now, source: 'scaffold flow model', unit: 'USD mm', categories: cats, t: t, series: s };
    }

    return {
      advance: advance,
      quote(sym) { const q = inst.get(sym); return q ? view(q) : null; },
      quotes(syms) { return syms.map((s) => (inst.get(s) ? view(inst.get(s)) : tableQuote(s))).filter(Boolean); },
      series: series,
      instruments() { return Array.from(inst.values()).map(view); },
      table: tableView,
      rowSeries: rowSeries,
      flow: flow,
      realizedVol(sym) {
        const q = inst.get(sym);
        const d = q.daily.slice(-22).map((p) => p[1]);
        const rets = d.slice(1).map((v, k) => Math.log(v / d[k]));
        const m = rets.reduce((a, b) => a + b, 0) / rets.length;
        const sd = Math.sqrt(rets.reduce((a, b) => a + (b - m) * (b - m), 0) / (rets.length - 1));
        return sd * Math.sqrt(252);
      },
      dailyReturns(sym, n) {
        const q = inst.get(sym);
        const d = q.daily.map((p) => p[1]).concat([q.px]);
        const rets = d.slice(1).map((v, k) => v / d[k] - 1);
        return rets.slice(-n);
      },
      fillDeltas: fillDeltas,
    };

    function tableQuote(sym) {
      const all = tables.commodities.concat(tables.fx);
      const r = all.find((x) => x.sym === sym);
      if (!r) return null;
      return { sym: r.sym, name: r.name, kind: r.kind, px: r.px, prev: r.prev, chg: r.px - r.prev, chgPct: (r.px - r.prev) / r.prev, hi: r.hi, lo: r.lo, ts: r.ts, spark: r.spark.slice() };
    }
  };
})();

/* ---- js/mock/agent.js ---- */
/* Scaffold agent: a rules-based reasoner over the scaffold data. Answers first, then sources and a numeric confidence.
   It never invents prices or pass times: every number comes from the market sim or the scene passes,
   and every comparative sentence (largest, smaller, agree, diverge) is chosen from those numbers, not fixed text. */
(function () {
  'use strict';
  const TT = window.TT;
  const F = TT.fmt;

  TT.mock.agent = function (M, prompt, ctx) {
    ctx = ctx || {};
    const p = String(prompt || '').toLowerCase();
    const q = (s) => M.market.quote(s) || M.market.quotes([s])[0];
    const qs = (s) => { const x = q(s); if (!x) return s + ' n/a'; return x.kind === 'yield' ? F.price(x.px, 'yield') + '% (' + F.bp(x.chg) + ')' : F.price(x.px, x.kind) + ' (' + F.pct(x.chgPct) + ')'; };
    const pct = (s) => { const x = q(s); return x ? (x.kind === 'yield' ? F.bp(x.chg) : F.pct(x.chgPct)) : 'n/a'; };
    const scene = (id) => M.scene(id);
    const latest = (id) => { const sc = scene(id); return { sc: sc, pass: sc.passes[sc.passes.length - 1], prev: sc.passes[sc.passes.length - 2], data: sc.pass(sc.passes.length - 1) }; };
    const segOf = (id, segId, i) => { const sc = scene(id); const idx = i == null ? sc.passes.length - 1 : i; return sc.pass(idx).segments.find((s) => s.id === segId); };
    const route = (id, seg) => 'orbital/' + id + (seg ? '/' + seg : '');
    const r2 = (v) => TT.round(v, 2);
    const quiet = (s) => { const x = q(s); return !!x && Math.abs(x.kind === 'yield' ? x.chg / 100 : x.chgPct) < 0.005; }; // under 0.5% is 'not reacting'

    function out(paras, sources, conf, missing) {
      return { text: paras.filter(Boolean).join('\n\n'), sources: sources, confidence: r2(TT.clamp(conf, 0.05, 0.99)), missing: missing || [], model: 'Spark 1.3' };
    }

    /* ---------- intents ---------- */
    function tank() {
      const L = latest('ela-segundo-tanks');
      const g = L.data.segments.find((s) => s.id === 'grp-b');
      const m = g.metric;
      const hist = L.sc.history.groupB;
      const deltas = hist.slice(1).map((v, k) => v - hist[k]);
      const priorMax = Math.max.apply(null, deltas.slice(0, -1).map(Math.abs));
      const others = L.data.segments.filter((s) => s.group === 'tank' && s.id.indexOf('tk-b') !== 0);
      const otherMax = Math.max.apply(null, others.map((s) => Math.abs(s.metric.delta)));
      const rho = TT.pearson(M.market.fillDeltas, M.market.dailyReturns('CL1', M.market.fillDeltas.length));
      const members = L.data.segments.filter((s) => s.group === 'tank' && s.id.indexOf('tk-b') === 0);
      const low = members.filter((s) => s.conf < 0.8).length;
      const cl = q('CL1'), co = q('CO1');
      return out([
        'Group B at El Segundo (6 floating-roof tanks) fell from ' + m.prior.toFixed(1) + '% to ' + m.value.toFixed(1) + '% fill between the ' + F.utcDate(L.prev.ts) + ' and ' + F.utcDate(L.pass.ts) +
          ' passes, a ' + F.delta(m.delta, 1) + ' pp move and an estimated ' + F.delta(g.extra.value, 2) + ' Mbbl. ' + (Math.abs(m.delta) > priorMax
            ? 'That is the largest single-pass change in the ' + hist.length + '-pass history; the previous largest was ' + priorMax.toFixed(1) + ' pp.'
            : 'The largest single-pass change in the ' + hist.length + '-pass history is ' + priorMax.toFixed(1) + ' pp, so this one is not a record.'),
        'WTI is ' + F.pct(cl.chgPct) + ' on the session at ' + F.price(cl.px) + '. Across the last ' + M.market.fillDeltas.length + ' pass intervals, group B fill changes and WTI daily returns correlate at ' + F.delta(rho, 2) +
          (rho <= -0.3 ? ', so draws have tended to coincide with price strength.' : rho >= 0.3 ? ', so draws have tended to coincide with price weakness.' : ', too weak to read draws as a price signal.') +
          ' Brent is ' + F.pct(co.chgPct) + (Math.abs(co.chgPct) < Math.abs(cl.chgPct) ? ', a smaller move, which fits a regional supply story more than a global one.' : ', at least as large a move, which points to a global driver rather than a regional one.'),
        'The other ' + others.length + ' tanks at the site moved by ' + otherMax.toFixed(1) + ' pp or less, so this looks specific to group B rather than a site-wide outage. Group confidence is ' + g.conf.toFixed(2) + '; ' +
          (low ? low + ' member tank(s) sit below the 0.80 display filter.' : 'all six member tanks clear the 0.80 display filter.'),
        'Not visible from here: pipeline flows, refinery run rates, and the reason for the transfer. Next I would check the following pass for continuation and the weekly inventory report for confirmation.',
      ], [
        { label: 'Orbital · El Segundo ' + F.utc(L.pass.ts, false), route: route('ela-segundo-tanks', 'grp-b') },
        { label: 'Macro · WTI CL1', route: 'macro' },
        { label: 'Watchlist · CO1', route: 'desk' },
      ], g.conf * 0.95, ['pipeline flow data', 'refinery run rates']);
    }

    function port() {
      const L = latest('san-pedro-port');
      const a = L.data.segments.find((s) => s.id === 'anchorage');
      const y = L.data.segments.find((s) => s.id === 'yard');
      const g = L.data.segments.find((s) => s.id === 'gate');
      const h = L.sc.history.anchorage;
      const berths = L.data.segments.filter((s) => s.id.indexOf('berth-') === 0).length;
      const rising = h.slice(1).every((v, k) => v > h[k]);
      return out([
        'The San Pedro Bay anchorage held ' + a.metric.value + ' vessels on the ' + F.utcDate(L.pass.ts) + ' pass, up ' + a.metric.delta + ' from the prior weekly pass and up from ' + h[0] + ' six passes ago. ' +
          (rising ? 'Each of the last five passes has been higher than the one before.' : 'The trend is up but not monotonic.'),
        'Inside the terminal, container yard utilization rose to ' + y.metric.value + '% from ' + y.metric.prior + '%, and the gate queue is ' + g.metric.value + ' trucks, up from ' + g.metric.prior + '. Ships waiting while the yard fills points to landside congestion rather than a berth shortage: ' + berths + ' of 4 berths are occupied.',
        (quiet('SPX') && quiet('RTY') ? 'Linked markets are not reacting yet: S&P 500 ' : 'Linked markets: S&P 500 ') + pct('SPX') + ', Russell 2000 ' + pct('RTY') + '. The anchorage alert threshold is 28 vessels.',
        'Missing: vessel identities and cargo, which need AIS data. Next I would check yard dwell time on the next weekly pass.',
      ], [
        { label: 'Orbital · San Pedro Bay ' + F.utc(L.pass.ts, false), route: route('san-pedro-port', 'anchorage') },
        { label: 'Satellite intel', route: 'intel' },
        { label: 'Watchlist · SPX RTY', route: 'desk' },
      ], a.conf * 0.95, ['AIS vessel identities']);
    }

    function brief() {
      const es = latest('ela-segundo-tanks').data.segments.find((s) => s.id === 'grp-b');
      const sp = latest('san-pedro-port');
      const an = sp.data.segments.find((s) => s.id === 'anchorage');
      const cu = latest('cushing-hub').data.segments.find((s) => s.id === 'grp-e');
      const gw = latest('gary-works');
      const ore = gw.data.segments.find((s) => s.id === 'ore');
      const oreHist = gw.sc.history.ore;
      const by = latest('barstow-rail').data.segments.find((s) => s.id === 'class-yard');
      const vix = q('VIX');
      const rv = M.market.realizedVol('SPX') * 100;
      return out([
        'Markets: S&P 500 ' + qs('SPX') + ', Nasdaq 100 ' + pct('NDX') + ', Russell 2000 ' + pct('RTY') + '. WTI ' + qs('CL1') + ' leads commodities; Brent ' + pct('CO1') + ', copper ' + pct('HG1') + ', gold ' + pct('GC1') +
          '. UST 10Y ' + qs('US10Y') + ', 2Y ' + pct('US2Y') + '. DXY ' + qs('DXY') + '. VIX ' + qs('VIX') + '.',
        'Ground truth: El Segundo group B fill moved ' + F.delta(es.metric.delta, 1) + ' pp to ' + es.metric.value.toFixed(1) + '% on the latest pass. San Pedro Bay anchorage is at ' + an.metric.value + ' vessels, up from ' + sp.sc.history.anchorage[0] +
          ' six weekly passes ago. Cushing east fill ' + F.delta(cu.metric.delta, 1) + ' pp. Gary ore stockpile ' + ore.metric.value.toFixed(2) + ' Mt, ' + F.pct(ore.metric.value / oreHist[0] - 1, 1) + ' over six passes. Barstow yard ' + by.metric.value + ' railcars (' + F.delta(by.metric.delta, 0) + ').',
        (es.metric.delta < 0 && q('CL1').chgPct > 0 ? 'Where they agree: the El Segundo draw and the WTI rally point the same way. '
          : es.metric.delta < 0 ? 'Where they disagree: El Segundo is drawing while WTI is ' + pct('CL1') + '. '
          : 'El Segundo is building while WTI is ' + pct('CL1') + '. ') +
          (an.metric.delta > 0 ? 'Port congestion is building while VIX at ' : 'Port congestion is easing; VIX at ') + F.price(vix.px) + ' sits ' + (vix.px < rv ? 'below' : 'above') + ' one-month S&P realized vol of ' + rv.toFixed(1) + '%.',
        'Watch next: the next El Segundo pass, the anchorage threshold at 28 vessels, and whether copper follows the Gary stockpile drawdown.',
      ], [
        { label: 'Watchlist', route: 'desk' },
        { label: 'Macro', route: 'macro' },
        { label: 'Orbital · El Segundo', route: route('ela-segundo-tanks', 'grp-b') },
        { label: 'Orbital · San Pedro Bay', route: route('san-pedro-port', 'anchorage') },
        { label: 'Satellite intel', route: 'intel' },
      ], 0.78);
    }

    function divergence() {
      const vix = q('VIX');
      const rv = M.market.realizedVol('SPX') * 100;
      const sp = latest('san-pedro-port');
      const an = sp.data.segments.find((s) => s.id === 'anchorage');
      const y = sp.data.segments.find((s) => s.id === 'yard');
      const h = sp.sc.history.anchorage;
      const diff = vix.px - rv;
      return out([
        'VIX is ' + qs('VIX') + '. One-month realized volatility on the S&P 500 is ' + rv.toFixed(1) + '%, so implied is ' + (diff >= 0 ? 'above' : 'below') + ' realized by ' + Math.abs(diff).toFixed(1) + ' points.',
        (an.metric.value > h[0] && vix.chgPct < 0
          ? 'Physical stress is building while vol eases: the San Pedro Bay anchorage rose from ' + h[0] + ' to ' + an.metric.value + ' vessels over six weekly passes (' + F.pct(an.metric.value / h[0] - 1, 0) + '), and container yard utilization is ' + y.metric.value + '%. Equity vol is not pricing that friction.'
          : 'The San Pedro Bay anchorage went from ' + h[0] + ' to ' + an.metric.value + ' vessels over six weekly passes (' + F.pct(an.metric.value / h[0] - 1, 0) + ') with container yard utilization at ' + y.metric.value + '%, while VIX is ' + pct('VIX') + '.'),
        'Energy: WTI is ' + pct('CL1') + ' while VIX is ' + pct('VIX') + '. ' + (q('CL1').chgPct > 0 && vix.chgPct < 0 ? 'A commodity-led move with falling equity vol fits the El Segundo drawdown better than a macro shock.' : 'These are not moving in the commodity-led pattern, so I would not read the El Segundo move into vol.'),
        'Not in context: options skew and term structure, which would show whether the tail is being hedged. That is what I would check next.',
      ], [
        { label: 'Macro · VIX', route: 'macro' },
        { label: 'Macro · SPX realized vol', route: 'macro' },
        { label: 'Orbital · San Pedro Bay', route: route('san-pedro-port', 'anchorage') },
        { label: 'Orbital · El Segundo', route: route('ela-segundo-tanks', 'grp-b') },
      ], 0.71, ['options skew', 'vol term structure']);
    }

    function siteBrief(id) {
      const L = latest(id);
      const k = L.data.segments.find((s) => s.id === L.sc.key);
      const meta = L.sc.meta;
      const m = k.metric;
      const linked = meta.linked.map((s) => q(s)).filter(Boolean);
      return out([
        meta.name + ': ' + k.label.split(' · ')[0] + ' ' + m.name.toLowerCase() + ' is ' + fmtMetric(m.value, m) + ' on the ' + F.utcDate(L.pass.ts) + ' pass, versus ' + fmtMetric(m.prior, m) + ' on the prior pass (' + F.delta(m.delta, m.digits == null ? 1 : m.digits) + (m.deltaUnit ? ' ' + m.deltaUnit.trim() : '') + '). Confidence ' + k.conf.toFixed(2) + '.',
        'Linked markets: ' + linked.map((x) => x.sym + ' ' + (x.kind === 'yield' ? F.bp(x.chg) : F.pct(x.chgPct))).join(', ') + '.',
        'Detection rule: ' + k.rule,
      ], [
        { label: 'Orbital · ' + meta.short + ' ' + F.utc(L.pass.ts, false), route: route(id, k.id) },
        { label: 'Watchlist · ' + meta.linked.join(' '), route: 'desk' },
      ], k.conf * 0.93);
    }

    function fmtMetric(v, m) {
      if (typeof v !== 'number') return String(v);
      const d = m.digits == null ? 1 : m.digits;
      return F.num(v, d) + (m.unit || '');
    }

    function segment(site, id, i) {
      const sc = scene(site);
      if (!sc) return unknown();
      const idx = i == null ? sc.passes.length - 1 : i;
      const s = segOf(site, id, idx);
      if (!s) return out(['That segment is not detected on the selected pass, so I have no measurement for it.', 'Next I would check the prior pass in the orbital viewer.'],
        [{ label: 'Orbital · ' + sc.meta.short, route: route(site) }], 0.3, ['segment on selected pass']);
      if (site === 'ela-segundo-tanks' && id === 'grp-b' && idx === sc.passes.length - 1) return tank();
      if (site === 'san-pedro-port' && id === 'anchorage' && idx === sc.passes.length - 1) return port();
      const m = s.metric;
      const pass = sc.passes[idx];
      const linked = sc.meta.linked.map((x) => q(x)).filter(Boolean);
      const changed = typeof m.value === 'number' && m.prior != null;
      return out([
        s.label.split(' \u00b7 ')[0] + ' at ' + sc.meta.name + ' is a ' + s.cls + ' segment detected at confidence ' + s.conf.toFixed(2) + ' on the ' + F.utcDate(pass.ts) + ' pass. ' +
          (changed ? m.name + ': ' + fmtMetric(m.value, m) + ' versus ' + fmtMetric(m.prior, m) + ' on the prior pass (' + F.delta(m.delta, m.digits == null ? 1 : m.digits) + (m.deltaUnit ? ' ' + m.deltaUnit.trim() : '') + ').' : m.name + ': ' + m.value + '.'),
        'Detection rule: ' + s.rule + ' Area ' + F.int(s.area_m2) + ' m².',
        linked.length ? 'Linked markets: ' + linked.map((x) => x.sym + ' ' + (x.kind === 'yield' ? F.bp(x.chg) : F.pct(x.chgPct))).join(', ') + '.' : '',
        s.conf < 0.8 ? 'This detection is below the 0.80 display filter, so treat it as low confidence.' : '',
      ], [
        { label: 'Orbital · ' + sc.meta.short + ' ' + F.utc(pass.ts, false), route: route(site, s.id) },
        { label: 'Satellite intel', route: 'intel' },
      ], s.conf * 0.92);
    }

    function symbol(sym) {
      const x = q(sym);
      if (!x) return unknown();
      const roots = { CL: 'CL1', CO: 'CO1', HG: 'HG1', NG: 'NG1', GC: 'GC1' };
      const root = /^[A-Z]{2}[FGHJKMNQUVXZ]\d$/.test(sym) ? roots[sym.slice(0, 2)] : null;
      const sites = TT.mock.data.sites.filter((s) => s.linked.indexOf(sym) >= 0 || (root && s.linked.indexOf(root) >= 0));
      const lines = sites.map((s) => {
        const L = latest(s.id);
        const k = L.data.segments.find((z) => z.id === L.sc.key);
        const m = k.metric;
        const lbl = k.label.split(' \u00b7 ')[0];
        return (lbl.indexOf(s.short) === 0 ? lbl : s.short + ' ' + lbl) + ' ' + m.name.toLowerCase() + ' ' + fmtMetric(m.value, m) + ' (' + F.delta(m.delta, m.digits == null ? 1 : m.digits) + (m.deltaUnit ? ' ' + m.deltaUnit.trim() : '') + ' vs prior pass)';
      });
      const range = x.kind === 'yield' ? F.price(x.lo, 'yield') + '% to ' + F.price(x.hi, 'yield') + '%' : F.price(x.lo, x.kind) + ' to ' + F.price(x.hi, x.kind);
      return out([
        x.name + ' (' + x.sym + ') is ' + qs(x.sym) + ' on the session. Range ' + range + '.',
        lines.length ? 'Linked physical signals: ' + lines.join('; ') + '.' : 'No monitored site is linked to ' + x.sym + ', so there is no ground-truth read for it.',
      ], [{ label: 'Watchlist · ' + x.sym, route: 'desk' }].concat(sites.map((s) => ({ label: 'Orbital · ' + s.short, route: route(s.id) }))), lines.length ? 0.8 : 0.74,
      lines.length ? [] : ['physical signal for ' + x.sym]);
    }

    function pins() {
      const list = (ctx.pins || []);
      if (!list.length) return out(['Nothing is pinned to my context. Click a watchlist row or use PIN TO CONTEXT on a segment, then ask again.'], [], 0.9);
      const parts = list.map((p) => {
        if (p.kind === 'symbol') { const x = q(p.id); return x ? x.sym + ' ' + qs(x.sym) : p.id + ' (no quote)'; }
        const s = segOf(p.site, p.id);
        return s ? s.label + ' ' + s.metric.name.toLowerCase() + ' ' + fmtMetric(s.metric.value, s.metric) + ' (conf ' + s.conf.toFixed(2) + ')' : p.label;
      });
      return out(['Pinned context: ' + parts.join('; ') + '.'], list.map((p) => ({ label: (p.kind === 'symbol' ? 'Watchlist · ' : 'Orbital · ') + p.label, route: p.kind === 'symbol' ? 'desk' : route(p.site, p.id) })), 0.88);
    }

    function guard(sym) {
      const base = sym ? symbol(sym) : brief();
      base.text = 'I don’t give trade instructions. Here is what the data shows.\n\n' + base.text;
      return base;
    }

    function unknown() {
      return out([
        'I don’t have data in the current context that answers that.',
        'What I can see: ' + TT.mock.data.instruments.length + ' instruments, 200 futures contracts, 200 FX pairs, ' + TT.mock.data.sites.length + ' monitored sites with 6 passes each, the wire, and capital flow by asset class.',
        'Next I would check: whether one of those sources covers the question. Try naming a symbol (CL1, HG1, US10Y) or a site (El Segundo, San Pedro Bay, Cushing).',
      ], [], 0.22, ['a source covering this question']);
    }

    /* ---------- routing ---------- */
    const symWords = [
      [/\b(wti|crude|oil|cl1)\b/, 'CL1'], [/\b(brent|co1)\b/, 'CO1'], [/\b(nat(ural)? ?gas|ng1|henry hub)\b/, 'NG1'], [/\b(copper|hg1)\b/, 'HG1'], [/\b(gold|gc1|bullion)\b/, 'GC1'],
      [/\b(10y|ten.year|us10y|treasur)/, 'US10Y'], [/\b(2y|two.year|us2y)\b/, 'US2Y'], [/\b(dollar|dxy)\b/, 'DXY'], [/\b(vix)\b/, 'VIX'], [/\b(euro|eurusd)\b/, 'EURUSD'],
      [/\b(yen|usdjpy)\b/, 'USDJPY'], [/\b(s&p|spx|s and p)\b/, 'SPX'], [/\b(nasdaq|ndx)\b/, 'NDX'], [/\b(russell|rty|small caps?)\b/, 'RTY'],
    ];
    const mentioned = () => {
      const up = String(prompt || '').toUpperCase();
      const direct = up.match(/\b[A-Z]{2,4}[FGHJKMNQUVXZ]\d\b|\b[A-Z]{6}\b|\b[A-Z]{2,3}\d\b|\bUS\d{1,2}Y\b/g) || [];
      for (const d of direct) if (q(d)) return d;
      for (const [re, s] of symWords) if (re.test(p)) return s;
      return null;
    };

    if (/\b(should i|do i|tell me to|is it time to)\b.*\b(buy|sell|short|long|go long|go short)\b|\b(buy|sell|short)\b.*\b(now|today|here)\b/.test(p)) return guard(mentioned());
    if (ctx.segment && /\b(this|segment|it)\b/.test(p) && !/brief me$/.test(p.trim())) return segment(ctx.segment.site, ctx.segment.id, ctx.segment.pass);
    if (/\btanks?\b|drawdown|segundo|group b/.test(p)) return tank();
    if (/\bports?\b|anchorage|congestion|san pedro|vessels?\b|\bships?\b|container|yard util|gate queue/.test(p)) return port();
    if (/diverg|vol\b|volatility|vix/.test(p) && /diverg|vs|versus|against|from vol/.test(p)) return divergence();
    if (/cushing/.test(p)) return siteBrief('cushing-hub');
    if (/\bgary\b|\biron ore\b|\bore\b|stockpile|\bsteel\b/.test(p)) return siteBrief('gary-works');
    if (/barstow|\brail\b|railcars?|rail yard/.test(p)) return siteBrief('barstow-rail');
    if (/ontario|\bretail\b|parking|shoppers?/.test(p)) return siteBrief('ontario-retail');
    if (/brief|overview|summary|what('s| is) (going on|happening|moving)|catch me up/.test(p)) return brief();
    if (/pinned|my context|these|watchlist/.test(p)) return pins();
    const sym = mentioned();
    if (sym) return symbol(sym);
    if (ctx.segment) return segment(ctx.segment.site, ctx.segment.id, ctx.segment.pass);
    return unknown();
  };
})();

/* Scaffold backend. Implements the TERRATERM contract (see CONTRACT.md) with synthetic data.
   Required: watchlist, macro, imagery, ask. Optional: sites, quotes, series, flow, wire, events, system. */
(function () {
  'use strict';
  const TT = window.TT;

  TT.mock.createScaffold = function (opts) {
    opts = opts || {};
    const D = TT.mock.data;
    const demo = !!opts.demo;
    const cfg = opts.config || {};
    const boot = Date.now();
    const market = TT.mock.Market({ seed: 7, demo: demo, bootTs: boot });
    const scene = (id) => TT.mock.scenes.get(id, boot);
    const M = { market: market, scene: scene, boot: boot, demo: demo };
    let feedUp = true;
    let ctxUsed = demo ? 181200 : 184000; // demo lands on 184K after the beat 3 answer (§18 beat 5)
    const CTX_MAX = 1000000;
    const lat = (a, b) => TT.sleep(a + Math.random() * (b - a));
    const guard = () => { if (!feedUp) throw new Error('Feed disconnected'); };

    /* ---------- events ---------- */
    let seq = 0;
    const events = [];
    const push = (ev) => { ev.seq = ++seq; events.push(ev); return ev; };
    const keySeg = (id) => { const sc = scene(id); const i = sc.passes.length - 1; return { sc: sc, i: i, pass: sc.passes[i], seg: sc.pass(i).segments.find((s) => s.id === sc.key) }; };
    D.sites.forEach((s) => {
      const k = keySeg(s.id);
      push({ type: 'pass', ts: k.pass.ts + 4 * 60000, site: s.id, text: s.short + ' pass processed · ' + k.sc.pass(k.i).segments.length + ' segments', route: 'orbital/' + s.id });
    });
    { const k = keySeg('ela-segundo-tanks'); const m = k.seg.metric;
      push({ type: 'alert', id: 'al-es-drawdown', sev: 'high', ts: k.pass.ts + 6 * 60000, site: 'ela-segundo-tanks', segId: 'grp-b', subject: 'El Segundo · TK GROUP B',
        message: 'Group B fill ' + TT.fmt.delta(m.delta, 1) + ' pp vs prior pass (' + m.prior.toFixed(1) + '% to ' + m.value.toFixed(1) + '%), est. ' + TT.fmt.delta(k.seg.extra.value, 2) + ' Mbbl', conf: k.seg.conf, route: 'orbital/ela-segundo-tanks/grp-b' }); }
    { const k = keySeg('gary-works'); const h = k.sc.history.ore;
      push({ type: 'alert', id: 'al-gary-ore', sev: 'med', ts: k.pass.ts + 7 * 60000, site: 'gary-works', segId: 'ore', subject: 'Gary · ORE STOCKPILE',
        message: 'Ore stockpile ' + k.seg.metric.value.toFixed(2) + ' Mt, ' + TT.fmt.pct(h[h.length - 1] / h[0] - 1, 1) + ' over six passes', conf: k.seg.conf, route: 'orbital/gary-works/ore' }); }
    push({ type: 'macro', ts: boot - 6 * 60000, sym: 'CL1', text: 'WTI crosses 78.00, ' + TT.fmt.pct(market.quote('CL1').chgPct) + ' on the session', route: 'macro' });
    push({ type: 'system', ts: boot - 30000, text: 'Glimmer 30B local agent online · context restored ' + TT.fmt.tokens(ctxUsed) });
    events.sort((a, b) => a.ts - b.ts).forEach((e, k) => { e.seq = k + 1; });
    seq = events.length;

    const scheduled = [
      { at: boot + (demo ? 62000 : 40000), make: () => { const k = keySeg('san-pedro-port'); const m = k.seg.metric; return { type: 'alert', id: 'al-port-anch', sev: 'high', proactive: true, site: 'san-pedro-port', segId: 'anchorage', subject: 'San Pedro Bay · ANCHORAGE',
        message: 'Anchorage count ' + m.value + ' vessels crossed the 28 threshold (+' + m.delta + ' vs prior pass)', conf: k.seg.conf, route: 'orbital/san-pedro-port/anchorage' }; } },
      { at: boot + (demo ? 600000 : 150000), make: () => { const k = keySeg('cushing-hub'); const m = k.seg.metric; return { type: 'alert', id: 'al-cushing-build', sev: 'med', proactive: true, site: 'cushing-hub', segId: 'grp-e', subject: 'Cushing · EAST GROUP',
        message: 'East group fill ' + TT.fmt.delta(m.delta, 1) + ' pp vs prior pass crossed the 2.0 pp build threshold', conf: k.seg.conf, route: 'orbital/cushing-hub/grp-e' }; } },
    ];
    function release(now) {
      scheduled.forEach((s) => { if (!s.done && now >= s.at) { s.done = true; const ev = s.make(); ev.ts = now; push(ev); } });
    }

    /* ---------- wire ---------- */
    const wire = D.wire.map((w, k) => Object.assign({ id: 'w' + k, ts: boot - w.mins * 60000 }, w));
    let wireNext = boot + (demo ? 70000 : 45000), wireIdx = 0;
    function releaseWire(now) {
      while (now >= wireNext && wireIdx < D.wireLater.length) {
        wire.push(Object.assign({ id: 'wl' + wireIdx, ts: wireNext }, D.wireLater[wireIdx]));
        wireIdx++; wireNext += demo ? 70000 : 45000;
      }
    }

    /* ---------- signals for the macro overlay ---------- */
    const thresholds = { 'ela-segundo-tanks': 5, 'san-pedro-port': 4, 'cushing-hub': 2, 'barstow-rail': 20, 'gary-works': 0.06 };
    function signals() {
      const out = [];
      D.sites.forEach((meta) => {
        const thr = thresholds[meta.id];
        if (thr == null) return;
        const sc = scene(meta.id);
        const raw = sc.passes.map((p, j) => { const s = sc.pass(j).segments.find((z) => z.id === sc.key); return { t: p.ts, v: s.metric.value, pass: p.id }; });
        sc.passes.forEach((p, j) => {
          const s = sc.pass(j).segments.find((z) => z.id === sc.key);
          if (typeof s.metric.delta === 'number' && Math.abs(s.metric.delta) >= thr) {
            out.push({ id: meta.id + ':' + j, t: p.ts, sym: meta.linked[0], site: meta.id, segId: s.id, pass: j,
              label: meta.short + ' ' + s.metric.name.toLowerCase() + ' ' + TT.fmt.delta(s.metric.delta, s.metric.digits == null ? 1 : s.metric.digits) + (s.metric.deltaUnit ? ' ' + s.metric.deltaUnit.trim() : ''),
              rule: s.rule + ' Overlay threshold: single-pass change of ' + thr + (s.metric.deltaUnit ? ' ' + s.metric.deltaUnit.trim() : '') + ' or more.', metric: s.metric.name, unit: s.metric.unit, conf: s.conf, raw: raw });
          }
        });
      });
      return out;
    }

    function passPayload(sc, i) {
      const p = sc.passes[i];
      const data = sc.pass(i);
      return { id: p.id, i: i, ts: p.ts, sensor: cfg.sensorLabel || 'SAT VHR', gsd: sc.meta.gsd, model: TT.mock.scenes.MODEL, imageUrl: null,
        scene: { siteId: sc.meta.id, w: TT.mock.scenes.W, h: TT.mock.scenes.H, static: sc.static, items: data.items }, segments: data.segments };
    }

    const api = {
      async watchlist(o) {
        await lat(30, 80); guard();
        const now = Date.now(); market.advance(now);
        const syms = (o && o.symbols && o.symbols.length) ? o.symbols : D.defaultWatchlist;
        return { asOf: now, source: 'scaffold feed', quotes: market.quotes(syms) };
      },
      async macro(o) {
        await lat(60, 140); guard();
        const tf = (o && o.tf) || '1D';
        const now = Date.now(); market.advance(now);
        const kpis = D.kpiMap.map((k) => {
          const s = market.series(k.sym, tf, now); const q = market.quote(k.sym);
          const first = s[0][1], last = s[s.length - 1][1];
          return { slot: k.slot, sym: k.sym, name: q.name, kind: q.kind, value: q.px, chg: last - first, chgPct: last / first - 1, tf: tf };
        });
        const series = D.kpiMap.map((k) => { const q = market.quote(k.sym); return { id: k.sym, name: q.name, kind: q.kind, points: market.series(k.sym, tf, now) }; });
        return { asOf: now, source: 'scaffold feed', tf: tf, kpis: kpis, series: series, signals: signals() };
      },
      async imagery(o) {
        await lat(160, 280); guard();
        const sc = scene(o && o.site);
        if (!sc) throw new Error('Unknown site');
        let i = sc.passes.length - 1;
        if (o.pass != null) { const f = sc.passes.findIndex((p) => p.id === o.pass || p.i === Number(o.pass)); if (f >= 0) i = f; }
        const res = { asOf: Date.now(), site: Object.assign({ key: sc.key }, sc.meta), passes: sc.passes.map((p) => ({ id: p.id, i: p.i, ts: p.ts })), pass: passPayload(sc, i), prior: i > 0 ? passPayload(sc, i - 1) : null };
        return res;
      },
      async ask(o) {
        const signal = o && o.signal;
        await TT.sleep(650 + Math.random() * 400, signal);
        if (!feedUp) throw new Error('Agent unreachable');
        const ans = TT.mock.agent(M, o.prompt, o.context || {});
        const parts = ans.text.match(/\S+\s*/g) || [];
        let acc = '';
        for (let k = 0; k < parts.length; k += 2) {
          if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
          const chunk = parts.slice(k, k + 2).join('');
          acc += chunk;
          if (o.onToken) o.onToken(chunk, acc);
          await TT.sleep(16, signal);
        }
        ctxUsed = Math.min(CTX_MAX, ctxUsed + Math.round((o.prompt.length + ans.text.length) / 4) + 2600);
        return ans;
      },
      async sites() {
        await lat(40, 90); guard();
        return { asOf: Date.now(), sites: D.sites.map((meta) => {
          const sc = scene(meta.id); const i = sc.passes.length - 1; const data = sc.pass(i); const k = data.segments.find((s) => s.id === sc.key);
          const keySeries = sc.passes.map((p, j) => ({ t: p.ts, v: sc.pass(j).segments.find((s) => s.id === sc.key).metric.value }));
          return Object.assign({}, meta, { key: sc.key, latestPass: sc.passes[i].ts, passCount: sc.passes.length, segments: data.segments.length, keyLabel: k.label.split(' · ')[0], keyMetric: k.metric, keyConf: k.conf, keySeries: keySeries });
        }) };
      },
      async quotes(o) {
        await lat(40, 110); guard();
        const now = Date.now(); market.advance(now);
        return { asOf: now, source: 'scaffold feed', kind: o.kind, rows: market.table(o.kind) };
      },
      async series(o) {
        await lat(40, 90); guard();
        const now = Date.now();
        if (market.quote(o.sym)) { const q = market.quote(o.sym); return { asOf: now, sym: o.sym, name: q.name, kind: q.kind, points: market.series(o.sym, '1D', now) }; }
        const r = market.rowSeries(o.sym, now);
        if (!r) throw new Error('Unknown symbol');
        return Object.assign({ asOf: now }, r);
      },
      async flow() { await lat(50, 120); guard(); return market.flow(Date.now()); },
      async wire() {
        await lat(30, 80); guard();
        const now = Date.now(); releaseWire(now);
        return { asOf: now, source: 'scaffold wire', items: wire.slice().sort((a, b) => b.ts - a.ts).slice(0, 40) };
      },
      async events(o) {
        await lat(20, 60); guard();
        const now = Date.now(); release(now);
        const since = (o && o.since) || 0;
        return { asOf: now, events: events.filter((e) => e.seq > since) };
      },
      async system() {
        await lat(20, 60);
        const j = (a, b) => Math.round(a + Math.random() * (b - a));
        return { asOf: Date.now(), mode: 'scaffold', feed: feedUp,
          models: [
            { name: 'SAM 3.1', role: 'segmentation', where: 'cloud', status: feedUp ? 'ok' : 'down', latencyMs: j(160, 240) },
            { name: 'Spark 1.3', role: 'reasoning', where: 'cloud', status: feedUp ? 'ok' : 'down', latencyMs: j(380, 520) },
            { name: 'Glimmer 30B', role: 'local agent', where: 'local', status: 'ok', latencyMs: j(28, 52) },
          ],
          context: { used: ctxUsed, max: CTX_MAX },
          sourcesFused: D.instruments.length + D.sites.length + 2 + 2,
        };
      },
    };
    api.__debug = {
      feed(up) { feedUp = !!up; return feedUp; },
      setContext(n) { ctxUsed = Math.max(0, Math.min(CTX_MAX, n)); return ctxUsed; },
      fireScheduled() { scheduled.forEach((s) => { s.at = Math.min(s.at, Date.now()); }); },
      fireWire() { wireNext = Date.now(); },
      world: M,
    };
    return api;
  };
})();

/* Imagery renderer. Draws a pass from pass.imageUrl (live) or from the scaffold scene descriptor.
   Base terrain is cached per site; composited passes are cached in a small LRU. */
(function () {
  'use strict';
  const TT = window.TT;
  const W = 1600, H = 1000, S = 0.8, LRU = 12;
  const baseCache = new Map();
  const passCache = new Map();
  const imgCache = new Map();
  let grain = null;

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h); return c; };
  const ih = (seed, k) => { let x = (seed ^ Math.imul(k + 1, 2654435761)) >>> 0; x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; };

  function grainTile() {
    if (grain) return grain;
    const c = mk(160, 160), ctx = c.getContext('2d');
    const img = ctx.createImageData(160, 160);
    const rnd = TT.rng(99);
    for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (rnd() - 0.5) * 120; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    ctx.putImageData(img, 0, 0);
    grain = c;
    return c;
  }
  function overlayGrain(ctx, alpha, w, h) {
    ctx.save();
    ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = ctx.createPattern(grainTile(), 'repeat');
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  function path(ctx, pts) { ctx.beginPath(); pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); }
  function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const ch = (v) => Math.max(0, Math.min(255, Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f))));
    return 'rgb(' + ch(n >> 16) + ',' + ch((n >> 8) & 255) + ',' + ch(n & 255) + ')';
  }

  /* ---------- item painters (world coordinates) ---------- */
  const paint = {
    ground(ctx, it) {
      ctx.fillStyle = it.color; ctx.fillRect(0, 0, W, H);
      const rnd = TT.rng(it.seed);
      for (let k = 0; k < 240; k++) {
        const x = rnd() * W, y = rnd() * H, r = 20 + rnd() * 180;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        const light = rnd() < 0.5;
        g.addColorStop(0, light ? 'rgba(255,250,235,' + (0.03 + rnd() * 0.07) + ')' : 'rgba(30,25,20,' + (0.04 + rnd() * 0.08) + ')');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      ctx.strokeStyle = it.alt; ctx.globalAlpha = 0.35;
      for (let k = 0; k < 40; k++) { ctx.lineWidth = 1 + rnd() * 2; ctx.beginPath(); const x = rnd() * W, y = rnd() * H; ctx.moveTo(x, y); ctx.bezierCurveTo(x + rnd() * 200 - 100, y + rnd() * 200 - 100, x + rnd() * 300 - 150, y + rnd() * 300 - 150, x + rnd() * 400 - 200, y + rnd() * 400 - 200); ctx.stroke(); }
      ctx.globalAlpha = 1;
    },
    poly(ctx, it) { ctx.save(); ctx.globalAlpha = it.alpha == null ? 1 : it.alpha; path(ctx, it.pts); ctx.fillStyle = it.fill; ctx.fill(); ctx.restore(); },
    pad(ctx, it) { ctx.fillStyle = '#4c4a46'; ctx.fillRect(it.x, it.y, it.w, it.h); ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.strokeRect(it.x, it.y, it.w, it.h); },
    water(ctx, it) {
      ctx.save(); path(ctx, it.pts); ctx.clip();
      let minX = W, minY = H, maxX = 0, maxY = 0; it.pts.forEach(([x, y]) => { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); });
      const g = ctx.createLinearGradient(minX, minY, maxX, maxY);
      g.addColorStop(0, '#1f3d47'); g.addColorStop(1, '#14293a');
      ctx.fillStyle = g; ctx.fillRect(minX, minY, maxX - minX, maxY - minY);
      const rnd = TT.rng(Math.round(minX + minY));
      ctx.strokeStyle = 'rgba(160,200,210,0.07)'; ctx.lineWidth = 1;
      for (let k = 0; k < 900; k++) { const x = minX + rnd() * (maxX - minX), y = minY + rnd() * (maxY - minY), l = 6 + rnd() * 18; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + l, y - l * 0.18); ctx.stroke(); }
      ctx.restore();
      path(ctx, it.pts); ctx.strokeStyle = '#9b968b'; ctx.lineWidth = 3; ctx.stroke();

(function () {
  'use strict';

        paras.forEach((p, k) => body.append(H('p', { class: m.streaming && k === paras.length - 1 ? 'caret' : null }, p)));
      }
      const kids = [who, body];
      if (m.stopped) kids.push(H('div', { class: 'foot' }, H('span', null, 'Stopped before the answer finished.')));
      if (m.error) kids.push(H('div', { class: 'foot' }, H('div', { class: 'err' }, H('span', null, m.error.trim()), H('button', { class: 'btn', type: 'button', onclick: () => app().retryAsk(m.id) }, 'RETRY'))));
      if (!m.streaming && !m.error && !m.stopped && m.confidence != null) {
        const src = (m.sources || []).length
          ? (m.sources || []).map((s, k) => [k ? ' · ' : '', H('button', { class: 'src', type: 'button', onclick: () => TT.router.go(s.route) }, s.label)])

  TT.AgentPanel = AgentPanel;

/* ---- js/ui/desk.js ---- */
/* Desk (§8.1): six-panel grid. Watchlist+Wire, Macro+Orbital, Agent, Capital Flow, Event Timeline, System.
   Panels resize (gutter handles) and reorder (drag headers or Alt+Shift+Arrows); layout is saved per user (§4 v0.2). */
(function () {
  'use strict';
  const TT = window.TT;
  const H = TT.h;
  const F = TT.fmt;
  const app = () => TT.app;
  const ORDER = ['watch', 'macro', 'agent', 'flow', 'timeline', 'system'];

  TT.kpiCard = function (slot, sym, opts) {

    el.set = function (value, kind, chg, chgPct, label) {
      TT.setText(v, value == null ? '—' : (kind === 'yield' ? F.price(value, 'yield') + '%' : F.price(value, kind)));

  };
  TT.chgCell = function (td, q) {
    const d = q.kind === 'yield' ? q.chg : q.chgPct;
    const cls = 'num ' + TT.dir(d);
    if (td.className !== cls) td.className = cls;
    TT.setText(td, TT.tri(d) + ' ' + F.chg(q));
  };

  /* ---------- panel: watchlist + wire ---------- */
  function watchPanel() {
    const p = TT.ui.panel({ id: 'watch', title: 'WATCHLIST', sub: 'feed', noscroll: true });
    const tbody = H('tbody');
    const table = H('table', { class: 'tbl', role: 'grid', 'aria-label': 'Watchlist. Enter pins a row to agent context. Delete removes it.' },
      H('colgroup', null, H('col', { style: { width: '62px' } }), H('col', { class: 'c-spark', style: { width: '68px' } }), H('col'), H('col', { style: { width: '84px' } })),
      H('thead', null, H('tr', null, H('th', { scope: 'col' }, 'SYM'), H('th', { scope: 'col', class: 'c-spark' }, '4H'), H('th', { scope: 'col', class: 'num' }, 'LAST'), H('th', { scope: 'col', class: 'num' }, 'CHG'))), tbody);
    const wrap = H('div', { class: 'tbl-wrap', style: { flex: '3 1 0' } }, table);
    TT.ui.skeletonRows(tbody, 4, 12);
    const skelUntil = Date.now() + 400;
    const rows = new Map();
    let built = '';
    function build() {
      const key = app().watch.join(',');
      if (key === built && rows.size) return;
      built = key;
      rows.clear();
      if (!app().watch.length) { tbody.replaceChildren(H('tr', null, H('td', { colspan: '4', class: 'empty' }, 'Pin symbols to build your watchlist.'))); return; }
      tbody.replaceChildren.apply(tbody, app().watch.map((sym, k) => {
        const q = app().quotes.get(sym);
        const tr = H('tr', { class: 'row', tabindex: k === 0 ? '0' : '-1', dataset: { sym: sym }, 'aria-label': sym },
          H('td', { class: 'sym trunc', 'data-tip': q ? q.name : sym, 'data-src': 'Source: ' + app().quotesSource }, sym), H('td', { class: 'spark c-spark' }), H('td', { class: 'num' }), H('td', { class: 'num' }));
        rows.set(sym, tr);
        return tr;
      }));
      update([]);
    }
    function update(changed) {
      const flashes = new Map(changed.map((c) => [c.sym, c.dir]));
      rows.forEach((tr, sym) => {
        const q = app().quotes.get(sym);
        const [, sp, last, chg] = tr.children;
        if (!q) { TT.setText(last, '\u2014'); TT.setText(chg, '\u2014'); tr.setAttribute('aria-label', sym + ', no quote from the feed'); tr.children[0].dataset.tip = sym + ' · no quote from the feed'; return; }
        tr.children[0].dataset.tip = q.name;
        const lastTxt = q.kind === 'yield' ? F.price(q.px, 'yield') + '%' : F.price(q.px, q.kind);
        TT.setText(last, lastTxt);
        TT.chgCell(chg, q);
        if (q.spark && (flashes.has(sym) || !sp.firstChild)) sp.replaceChildren(TT.sparkNode(q.spark, 60, 20));
        if (flashes.has(sym)) { TT.ui.flash(last, flashes.get(sym)); TT.ui.flash(chg, flashes.get(sym)); }
        tr.classList.toggle('ctx', app().isPinned('symbol', sym));
        tr.setAttribute('aria-selected', app().isPinned('symbol', sym) ? 'true' : 'false');
        tr.setAttribute('aria-label', sym + ' ' + lastTxt + ' ' + F.chg(q) + (app().isPinned('symbol', sym) ? ', in agent context' : ''));
      });
    }
    const togglePin = (tr) => { const sym = tr.dataset.sym; const q = app().quotes.get(sym); app().togglePin({ kind: 'symbol', id: sym, label: sym }); TT.ui.toast((app().isPinned('symbol', sym) ? 'Pinned ' : 'Unpinned ') + sym + (app().isPinned('symbol', sym) ? ' to agent context.' : ' from agent context.')); update([]); if (q) { /* noop */ } };
    tbody.addEventListener('click', (e) => { const tr = e.target.closest('tr.row'); if (tr) togglePin(tr); });
    TT.ui.roving(tbody, 'tr.row', { onEnter: togglePin, onKey: (e, tr) => { if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); app().toggleWatch(tr.dataset.sym, false); } } });
    TT.bus.on('quotes', (e) => { if (Date.now() < skelUntil && !rows.size) { setTimeout(() => { build(); }, skelUntil - Date.now()); return; } build(); update(e.changed); p.sub(app().quotesSource + ' · 1s · ' + F.utc(app().quotesAsOf)); });
    TT.bus.on('watch', () => { built = null; build(); });

    new ResizeObserver(() => { p.el.classList.toggle('narrow', p.el.clientWidth < 280); TT.$$('.c-spark', p.el).forEach((c) => { c.style.display = p.el.clientWidth < 280 ? 'none' : ''; }); }).observe(p.el);

    // wire
    const tagSel = H('div', { class: 'seg-ctl', role: 'group', 'aria-label': 'Filter wire by tag' }, ['all', 'macro', 'geo', 'alert'].map((t) => H('button', { type: 'button', dataset: { tag: t }, 'aria-pressed': app().prefs.wireTag === t ? 'true' : 'false', onclick: () => { app().setPref('wireTag', t); renderWire(); } }, t.toUpperCase())));
    const symSel = H('select', { id: 'wire-sym', 'aria-label': 'Filter wire by symbol' });
    symSel.addEventListener('change', () => { app().setPref('wireSym', symSel.value); renderWire(); });
    const wireSub = H('span', { class: 'ps', text: 'wire' });
    const wireHead = H('div', { class: 'sh' }, H('h3', { class: 'pt', style: { margin: 0 } }, 'WIRE'), wireSub);
    const filters = H('div', { class: 'toolbar', style: { padding: '4px 10px' } }, tagSel, symSel);
    const list = H('ul', { class: 'list', 'aria-label': 'Wire' });
    const wireWrap = H('div', { style: { flex: '2 1 0', overflowY: 'auto', minHeight: '0' } }, list);
    const open = new Set();
    function renderWire(fresh) {
      const tag = app().prefs.wireTag, sym = app().prefs.wireSym;
      TT.$$('button', tagSel).forEach((b) => b.setAttribute('aria-pressed', b.dataset.tag === tag ? 'true' : 'false'));
      const syms = Array.from(new Set(app().wire.flatMap((w) => w.syms || []))).sort();
      const opts = ['all'].concat(syms);
      if (symSel.options.length !== opts.length) symSel.replaceChildren.apply(symSel, opts.map((s) => H('option', { value: s }, s === 'all' ? 'ALL SYMBOLS' : s)));
      symSel.value = opts.indexOf(sym) >= 0 ? sym : 'all';
      const items = app().wire.filter((w) => (tag === 'all' || w.tag === tag) && (sym === 'all' || (w.syms || []).indexOf(sym) >= 0));
      const wireDown = !!app().down.wire;

      list.replaceChildren.apply(list, items.map((w) => wireItem(w, open, fresh && fresh.indexOf(w.id) >= 0, () => renderWire())));
    }
    TT.bus.on('wire', (e) => renderWire(e.fresh));
    TT.bus.on('health', (name) => { if (name === 'wire') renderWire(); });
    p.body.append(wrap, wireHead, filters, wireWrap);

  /* ---------- layout: resize + reorder ---------- */
  function layout(desk, panels) {
    const L = Object.assign({ colL: 300, colR: 340, rowB: 220, order: ORDER.slice() }, app().prefs.layout || {});
    if (!Array.isArray(L.order) || L.order.length !== 6 || ORDER.some((id) => L.order.indexOf(id) < 0)) L.order = ORDER.slice();
    const apply = () => {
      desk.style.setProperty('--col-l', L.colL + 'px'); desk.style.setProperty('--col-r', L.colR + 'px'); desk.style.setProperty('--row-b', L.rowB + 'px');
      L.order.forEach((id, k) => { const el = panels[id].el; el.style.setProperty('--slot', k); el.dataset.slot = String(k); });
      [c1, c2, rr].forEach((h) => h.setAttribute('aria-valuenow', String(h === c1 ? L.colL : h === c2 ? L.colR : L.rowB)));
    };
    const save = () => app().setPref('layout', { colL: L.colL, colR: L.colR, rowB: L.rowB, order: L.order.slice() });
    const mk = (cls, label, key, min, max) => {
      const h = H('div', { class: 'rz ' + cls, role: 'separator', tabindex: '0', 'aria-label': label, 'aria-orientation': key === 'rowB' ? 'horizontal' : 'vertical', 'aria-valuemin': String(min), 'aria-valuemax': String(max), 'data-tip': label + ' · drag or use arrow keys' });
      h.addEventListener('pointerdown', (e) => {
        e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add('dragging');
        const move = (ev) => {

    { id: 'alerts', key: 'F8', label: 'Alerts', kw: 'inbox rules' },

  function items(q) {
