    const segSeen = new Set();
    sites.forEach((s) => {
      app().imgCache.forEach((p, key) => {
        if (key.indexOf(s.id + ':') !== 0 || !p._res) return;
        p._res.pass.segments.filter((g) => g.hud).forEach((g) => { const id = s.id + '/' + g.id; if (segSeen.has(id)) return; segSeen.add(id); out.push({ group: 'Segments', label: g.label.split(' · ')[0] + ' · ' + s.short, sub: g.cls + ' · conf ' + TT.fmt.conf(g.conf), kw: g.id, run: () => TT.router.go('orbital/' + id) }); });
      });
      const id = s.id + '/' + s.key;
      if (!segSeen.has(id)) { segSeen.add(id); out.push({ group: 'Segments', label: s.keyLabel + ' · ' + s.short, sub: s.keyMetric.name + ' ' + TT.metricText(s.keyMetric), kw: s.key, run: () => TT.router.go('orbital/' + id) }); }
    });
    const symSeen = new Set();
    app().quotes.forEach((qv, sym) => { symSeen.add(sym); out.push({ group: 'Symbols', label: sym, sub: qv.name, kw: qv.name, run: () => { app().togglePin({ kind: 'symbol', id: sym, label: sym }); TT.ui.toast((app().isPinned('symbol', sym) ? 'Pinned ' : 'Unpinned ') + sym + (app().isPinned('symbol', sym) ? ' to agent context.' : ' from agent context.')); } }); });
    ['commodities', 'fx'].forEach((kind) => {
      const v = TT.views[kind];
      if (v && v.data) v.data.forEach((qv, sym) => { if (symSeen.has(sym)) return; symSeen.add(sym); out.push({ group: 'Symbols', label: sym, sub: qv.name, kw: qv.name, run: () => TT.router.go(kind + '/' + sym) }); });
    });
    const scaffold = app().mode === 'scaffold';
    const actions = [
      { label: 'Show keyboard shortcuts', key: '?', run: () => TT.shortcuts() },
      { label: (app().prefs.tape ? 'Hide' : 'Show') + ' ticker tape', key: 'T', run: () => TT.shell.toggleTape() },
      { label: 'Reset desk layout', run: () => TT.views.desk.layout.reset() },
      { label: 'Acknowledge all alerts', run: () => app().ackAll() },
      { label: 'Clear agent conversation', run: () => { app().clearChat(); TT.ui.toast('Conversation cleared.'); } },
      { label: (TT.motionReduced() ? 'Allow' : 'Reduce') + ' motion', run: () => TT.shell.toggleMotion() },
      { label: app().prefs.saveChat === false ? 'Save agent conversation on this device' : 'Stop saving agent conversation on this device', kw: 'privacy storage history chat', run: () => app().setSaveChat(app().prefs.saveChat === false) },
    ];
    if (TT.demoAllowed()) actions.push({ label: app().demo.on ? 'Exit demo mode' : 'Start demo mode (90 second run)', kw: 'demo judge present', run: () => (app().demo.on ? TT.demo.exit() : TT.demo.start()) });
    if (app().demo.on) actions.push({ label: 'Demo: next beat', key: 'N', run: () => TT.demo.next() });
    if (scaffold) {
      actions.push({ label: app().feed.status === 'down' ? 'Restore feed (scaffold)' : 'Simulate feed outage (scaffold)', kw: 'offline stale test', run: () => { window.TERRATERM.debug.feed(app().feed.status === 'down'); app().retryFeed(); } });
      actions.push({ label: 'Clear saved layout, pins and chat', kw: 'storage reset', run: () => { TT.store.clear(); TT.ui.toast('Saved state cleared. Reload to start fresh.'); } });
    }
    actions.forEach((a) => out.push(Object.assign({ group: 'Actions' }, a)));
    const query = (q || '').trim();
    if (!query) return out.filter((i) => i.group === 'Views' || i.group === 'Actions' || i.group === 'Sites');
    const ranked = out.map((i) => ({ i: i, s: Math.max(TT.fuzzy(query, i.label), TT.fuzzy(query, i.kw || '') - 40, TT.fuzzy(query, i.sub || '') - 80) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 40).map((x) => x.i);
    ranked.push({ group: 'Agent', label: 'Ask TERRATERM: ' + query, run: () => { TT.router.go(TT.router.current.view === 'desk' ? 'desk' : 'agent'); app().ask(query); } });
    return ranked;
  }

  let state = null;
  TT.palette = {
    isOpen: () => !!state,
    open(initial) {
      if (state) { state.input.focus(); return; }
      const input = H('input', { class: 'input', id: 'palette-input', type: 'text', autocomplete: 'off', spellcheck: 'false', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'palette-list', 'aria-autocomplete': 'list', 'aria-label': 'Command', placeholder: 'Jump to a view, site, segment or symbol. Or ask the agent.' });
      const list = H('ul', { class: 'pal-list', id: 'palette-list', role: 'listbox', 'aria-label': 'Results' });
      const foot = H('div', { class: 'pal-foot' }, H('span', null, H('kbd', null, '↑↓'), ' move'), H('span', null, H('kbd', null, 'Enter'), ' select'), H('span', null, H('kbd', null, '1'), '–', H('kbd', null, '8'), ' views'), H('span', null, H('kbd', null, 'Esc'), ' close'));
      const box = H('div', { class: 'palette', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Command palette' }, input, list, foot);
      const scrim = H('div', { class: 'scrim' }, box);
      scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) TT.palette.close(); });
      document.body.append(scrim);
      requestAnimationFrame(() => scrim.classList.add('open'));
      const layer = TT.ui.pushLayer({ kind: 'palette', close: () => TT.palette.close() });
      state = { input: input, list: list, scrim: scrim, layer: layer, idx: 0, results: [] };
      const render = () => {
        state.results = items(input.value);
        state.idx = TT.clamp(state.idx, 0, Math.max(0, state.results.length - 1));
        let last = '';

          if (it.group !== last) { kids.push(H('li', { class: 'pal-group', role: 'presentation' }, it.group)); last = it.group; }

            H('span', { class: 'ic', 'aria-hidden': 'true' }, it.group === 'Views' ? '▦' : it.group === 'Sites' ? '◎' : it.group === 'Segments' ? '▢' : it.group === 'Symbols' ? '$' : it.group === 'Agent' ? '›' : '•'),
            H('span', { class: 'lbl' }, it.label), it.sub ? H('span', { class: 'sub' }, it.sub) : null, it.key ? H('kbd', null, it.key) : null);
          li.addEventListener('mousemove', () => { if (state.idx !== k) { state.idx = k; mark(); } });
          li.addEventListener('click', () => run(k));
          kids.push(li);
        });
        list.replaceChildren.apply(list, kids);
        mark();
      };
      const mark = () => {
        TT.$$('.pal-item', list).forEach((li) => li.setAttribute('aria-selected', Number(li.dataset.k) === state.idx ? 'true' : 'false'));
        const cur = list.querySelector('#pal-opt-' + state.idx);
        input.setAttribute('aria-activedescendant', cur ? cur.id : '');
        if (cur) cur.scrollIntoView({ block: 'nearest' });
      };
      const run = (k) => { const it = state.results[k]; if (!it) return; TT.palette.close(true); it.run(); };
      state.run = run;
      input.addEventListener('input', () => { state.idx = 0; render(); });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); state.idx = Math.min(state.results.length - 1, state.idx + 1); mark(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); state.idx = Math.max(0, state.idx - 1); mark(); }
        else if (e.key === 'Enter') { e.preventDefault(); run(state.idx); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); TT.palette.close(); }
        else if (/^[1-8]$/.test(e.key) && !input.value) { e.preventDefault(); TT.palette.close(true); TT.router.go(TT.VIEWS[Number(e.key) - 1].id); }
        else if (e.key === 'Tab') { e.preventDefault(); }
      });
      if (initial) input.value = initial;
      render();
      input.focus();
    },
    close(navigating) {
      if (!state) return;

    type(text) { if (!state) this.open(); state.input.value = text; state.input.dispatchEvent(new Event('input')); },
    runFirst() { if (state) state.run(0); },
  };

  TT.shortcuts = function () {

    TT.setText(e.modelSb, s.models.map((m) => m.name + (m.where === 'local' ? ' local' : '')).join(' · '));
    const mini = e.ctxSb.querySelector('.ctx-mini');

  function renderFeed() {

  }
  function renderTape() {
    const e = shell.el;

    const item = (sym) => { const q = app.quotes.get(sym); if (!q) return null; const d = q.kind === 'yield' ? q.chg : q.chgPct; return H('span', { class: 'tape-item' }, H('b', null, sym), (q.kind === 'yield' ? F.price(q.px, 'yield') + '%' : F.price(q.px, q.kind)) + ' ', H('span', { class: TT.dir(d) }, TT.tri(d) + ' ' + F.chg(q))); };
    const group = () => H('span', { class: 'tape-group' }, syms.map(item).filter(Boolean));
    e.tapeTrack.replaceChildren(group(), group());
  }
  shell.toggleTape = function () {
    app.setPref('tape', !app.prefs.tape);
    shell.el.tape.hidden = !app.prefs.tape;
    renderTape();
    TT.ui.toast('Ticker tape ' + (app.prefs.tape ? 'on.' : 'off.'));
  };
  function applyMotion() {
    const m = app.prefs.motion;
    const reduce = m === 'reduce' || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    document.documentElement.dataset.motion = reduce ? 'reduce' : 'full';
  }
  shell.toggleMotion = function () {
    app.setPref('motion', TT.motionReduced() ? 'full' : 'reduce');

    TT.ui.toast(TT.motionReduced() ? 'Motion reduced.' : 'Motion on.');
  };

  /* ---------- router: every view is URL addressable (§7) ---------- */
  const mounted = new Set();
  const router = (TT.router = {
    current: { view: null, params: [] },
    parse(hash) {
      let raw = String(hash || '').replace(/^#/, '').replace(/^\//, '');
      try { raw = decodeURIComponent(raw); } catch (e) { /* keep undecoded */ }
      const parts = raw.split(/[/.]/).filter(Boolean);
      let view = (parts[0] || '').toLowerCase();
      view = ALIASES[view] != null ? ALIASES[view] : view;
      if (view === 'demo') return { view: 'demo', params: [] };
      if (VIEW_IDS.indexOf(view) < 0) view = 'desk';
      return { view: view, params: parts.slice(1) };
    },
    go(route) {
      const hash = '#/' + route;
      if (location.hash === hash) { router.apply(router.parse(hash)); return; }
      try { history.pushState(null, '', hash); } catch (e) { /* sandboxed frames may refuse; apply anyway */ }
      router.apply(router.parse(hash));
    },
    apply(r) {
      if (r.view === 'demo') { TT.demo.start(); return; }
      const prev = router.current.view;
      const sameView = prev === r.view;
      if (TT.palette.isOpen()) TT.palette.close(true);
      if (!sameView || r.view !== 'orbital') TT.ui.closeDrawer();
      if (prev && !sameView && TT.views[prev] && TT.views[prev].hide) TT.views[prev].hide();
      router.current = { view: r.view, params: r.params };
      VIEW_IDS.forEach((id) => { shell.el.views[id].hidden = id !== r.view; });
      if (!mounted.has(r.view)) { mounted.add(r.view); TT.views[r.view].mount(shell.el.views[r.view]); }
      shell.el.links.forEach((a) => { if (a.dataset.view === r.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      document.title = 'TERRATERM · ' + (r.view === 'desk' ? 'Desk' : (TT.VIEWS.find((v) => v.id === r.view) || {}).label);
      if (TT.views[r.view].show) TT.views[r.view].show(r.params);
      if (!sameView && r.view !== 'agent') {
        const ae = document.activeElement;
        if (!ae || ae === document.body || !shell.el.views[r.view].contains(ae)) shell.el.views[r.view].focus({ preventScroll: true });
      }
      TT.bus.emit('route', router.current);
    },
    init() {
      // Back/forward fires both popstate and hashchange for the same entry; apply the route once.
      const onNav = () => {
        const r = router.parse(location.hash);
        if (r.view !== 'demo' && r.view === router.current.view && r.params.join('/') === router.current.params.join('/')) return;
        router.apply(r);
      };
      window.addEventListener('hashchange', onNav);
      window.addEventListener('popstate', onNav);
      router.apply(router.parse(location.hash));
    },
  });

  /* ---------- keyboard: keyboard first (§2, §7) ---------- */
  let lastPanel = null;
  document.addEventListener('focusin', (e) => { const p = e.target.closest && e.target.closest('.panel, .fv'); if (p) lastPanel = p; });
  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented) return;
    const fk = /^F([1-8])$/.exec(e.key);
    if (fk && !e.ctrlKey && !e.metaKey) { e.preventDefault(); router.go(TT.VIEWS[Number(fk[1]) - 1].id); return; }
    if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && /^Digit[0-8]$/.test(e.code)) { e.preventDefault(); const n = Number(e.code.slice(5)); router.go(n === 0 ? 'desk' : TT.VIEWS[n - 1].id); return; }
    if (e.key === 'Escape') {
      if (TT.ui.closeTop()) { e.preventDefault(); return; }
      if (app.stopAsk()) { e.preventDefault(); return; }
      const ae = document.activeElement;
      const panel = (ae && ae.closest && ae.closest('.panel, .fv')) || lastPanel;
      if (panel) { e.preventDefault(); (panel.classList.contains('panel') ? panel : panel.parentElement).focus({ preventScroll: true }); }
      return;
    }
    if (TT.isTyping(e.target) || e.ctrlKey || e.metaKey) return;
    const view = TT.views[router.current.view];
    if (view && view.handleKey && view.handleKey(e)) { e.preventDefault(); return; }
    if (e.altKey) return;
    if (e.key === '/') { e.preventDefault(); TT.palette.open(); return; }
    if (e.key === '?') { e.preventDefault(); TT.shortcuts(); return; }
    const k = e.key.toLowerCase();
    if (k === 'a') { e.preventDefault(); if (router.current.view !== 'desk' && router.current.view !== 'agent') router.go('agent'); const v = TT.views[router.current.view]; if (v.focusAgent) v.focusAgent(); return; }
    if (k === 't' && !e.target.closest('tr.row')) { e.preventDefault(); shell.toggleTape(); return; }
    if (k === 'n' && app.demo.on) { e.preventDefault(); TT.demo.next(); }
  });

  /* ---------- demo mode §18: scripted dataset, one key per beat ---------- */
  function setModeLabel() {
    TT.setText(shell.el.modeSb, app.mode.toUpperCase());
    shell.el.modeSb.classList.toggle('amber', app.mode === 'scaffold');
    TT.bus.emit('feed', app.feed);
    TT.bus.emit('mode', app.mode);
  }
  function reloadViewers(site) {
    const desk = TT.views.desk;
    if (desk.viewer) { desk.viewer.stop(); if (site) desk.viewer.load(site); }
    if (TT.views.orbital.viewer) { TT.views.orbital.viewer.stop(); TT.views.orbital.viewer.site = null; }
  }
  TT.demoAllowed = () => app.mode === 'scaffold' || app.demo.on || !!(app.config && app.config.allowDemo);
  let demoSnap = null; // what to go back to when demo mode ends: the user's own backend and mode
  TT.demo = {
    start(snap) {
      if (!TT.demoAllowed()) { TT.ui.toast('Demo mode is off while a live backend is attached.'); router.go('desk'); return; }
      if (!app.demo.on) demoSnap = snap || { api: app.api, mode: app.mode, debug: window.TERRATERM.debug, site: app.orbitalSite };
      const api = TT.mock.createScaffold({ demo: true, config: app.config });
      window.TERRATERM.debug = Object.assign({}, api.__debug, { app: app });
      app.demo = { on: true, t0: Date.now(), beat: 1 };
      app.mode = 'scaffold';
      app.resetData(api);
      app.orbitalSite = TT.mock.home.site;
      setModeLabel();
      shell.el.demoBadge.hidden = false; shell.el.demoSb.hidden = false;
      TT.ui.closeDrawer();
      router.go('desk');
      reloadViewers(TT.mock.home.site);
      TT.ui.toast('Demo mode. Press N for each beat. Your saved pins and conversation are untouched.');
    },
    exit() {
      if (!app.demo.on) return;
      const s = demoSnap || { api: null, mode: 'scaffold', debug: null, site: null };
      demoSnap = null;
      app.demo = { on: false, t0: 0, beat: 0 };
      app.mode = s.mode;
      app.resetData(s.api || TT.mock.createScaffold({ config: app.config }));
      app.restorePersisted();
      if (s.debug) window.TERRATERM.debug = s.debug; else delete window.TERRATERM.debug;
      app.orbitalSite = s.site;
      setModeLabel();
      shell.el.demoBadge.hidden = true; shell.el.demoSb.hidden = true;
      TT.ui.closeDrawer();
      reloadViewers(s.site || (app.sites[0] && app.sites[0].id));
      TT.ui.toast('Demo mode off. Back on the ' + app.mode + ' backend.');
    },
    adopt(snap) { demoSnap = snap; },
    async next() {
      if (!app.demo.on) return;
      const b = app.demo.beat;
      if (b === 1) {
        router.go('desk');
        const v = TT.views.desk.viewer;
        if (v.site !== TT.mock.home.site || !v.res) await v.load(TT.mock.home.site);
        v.select(TT.mock.home.seg);
      } else if (b === 2) {
        const d = TT.ui.drawer();
        const btn = d && TT.$$('.drawer-acts .btn-amber', d.el)[0];
        if (btn) btn.click(); else { const h = TT.mock.home; app.selected = { site: h.site, id: h.seg, pass: h.pass }; app.ask(h.prompt); }
      } else if (b === 3) {
        TT.palette.open();
        TT.palette.type('port');
        await TT.sleep(700);
        TT.palette.runFirst();
        await TT.sleep(400);
        const v = TT.views.orbital.viewer;
        if (v && !v.playing) v.play();
      } else if (b === 4) {
        const v = TT.views.orbital.viewer;
        if (v) v.stop();
        router.go('macro');
      } else return;
      app.demo.beat = Math.min(5, b + 1);
      tickClock();
    },
  };

  /* ---------- boot ---------- */
  function wrap(api) {
    const out = {};
    Object.keys(api).forEach((k) => { if (typeof api[k] === 'function') out[k] = function () { const a = arguments; return Promise.resolve().then(() => api[k].apply(api, a)); }; });
    return out;
  }
  TT.boot = function () {
    const ext = window.TERRATERM || {};
    const demoHash = /^#\/?demo\b/i.test(location.hash);
    const liveApi = !!(ext.api && REQUIRED.every((k) => typeof ext.api[k] === 'function'));
    const config = Object.assign({ org: liveApi ? '' : 'APEX STUDIO', sensorLabel: 'SAT VHR' }, ext.config || {});
    const demo = demoHash && (!liveApi || !!config.allowDemo);
    if (demoHash && !demo) { try { history.replaceState(null, '', '#/desk'); } catch (e) { /* noop */ } }
    const scaffold = TT.mock.createScaffold({ demo: false, config: config });
    let api = scaffold, mode = 'scaffold', fallbacks = [];
    if (ext.api && REQUIRED.every((k) => typeof ext.api[k] === 'function')) {
      fallbacks = OPTIONAL.filter((k) => typeof ext.api[k] !== 'function');
      api = Object.assign({}, scaffold);
      REQUIRED.concat(OPTIONAL).forEach((k) => { if (typeof ext.api[k] === 'function') api[k] = ext.api[k].bind(ext.api); });
      mode = ext.mode || 'live';
      fallbacks.forEach((k) => { delete api[k]; });
      delete api.__debug;
    } else if (ext.api) {
      console.warn('[TERRATERM] window.TERRATERM.api is missing one of: ' + REQUIRED.join(', ') + '. Running on the scaffold backend.');
    }
    app.api = wrap(api); app.mode = mode; app.config = config; app.fallbacks = fallbacks;
    window.TERRATERM = Object.assign(ext, { api: app.api, mode: mode, config: config, version: TT.VERSION, app: app });
    if (mode === 'scaffold') window.TERRATERM.debug = Object.assign({}, scaffold.__debug, { app: app });
    if (config.persistChat === false && TT.store.get('prefs', {}).saveChat == null) app.prefs.saveChat = false;
    app.loadPersisted({ watchlist: Array.isArray(config.watchlist) ? config.watchlist : mode === 'scaffold' ? TT.mock.data.defaultWatchlist : TT.KPI.map((k) => k[1]) });
    app.orbitalSite = config.defaultSite || (mode === 'scaffold' ? TT.mock.home.site : null);
    let demoSnapAtBoot = null;
    if (demo) {
      demoSnapAtBoot = { api: app.api, mode: mode, debug: window.TERRATERM.debug, site: app.orbitalSite };
      const dapi = TT.mock.createScaffold({ demo: true, config: config });
      app.api = wrap(dapi); app.mode = 'scaffold';
      window.TERRATERM.debug = Object.assign({}, dapi.__debug, { app: app });
      app.demo = { on: true, t0: Date.now(), beat: 1 };
      app.chat = []; app.acked = new Set(); app.pins = []; // in memory only; storage is left alone
      app.orbitalSite = TT.mock.home.site;
    }
    applyMotion();
    if (window.matchMedia) { const mq = window.matchMedia('(prefers-reduced-motion: reduce)'); if (mq.addEventListener) mq.addEventListener('change', applyMotion); }
    const root = document.getElementById('app');
    buildFrame(root);
    if (demo) { TT.demo.adopt(demoSnapAtBoot); shell.el.demoBadge.hidden = false; shell.el.demoSb.hidden = false; try { history.replaceState(null, '', '#/desk'); } catch (e) { /* noop */ } }
    TT.bus.on('system', renderSystem);
    TT.bus.on('feed', renderFeed);
    TT.bus.on('alerts', renderAlerts);
    TT.bus.on('quotes', TT.throttle(renderTape, 5000));
    TT.bus.on('tick', tickClock);
    tickClock(); renderFeed(); renderAlerts();
    router.init();
    app.start();
    root.setAttribute('aria-busy', 'false');
  };
})();

/* ---- js/ui/settings.js ---- */
/* Settings: API keys + backend config for the live service.
   Keys are never stored in the browser and never in the repo. This panel
   talks to the SAM service (default http://localhost:8000) and the service
   saves keys to settings.local.json on its own machine (gitignored, mode
   0600). The service URL itself is the only thing kept in localStorage.
   After pulling the repo on a new machine, open Settings here, paste the
   keys, save, and the app runs. Test buttons verify a key without saving
   it; an empty key field on Save leaves the saved value unchanged. */
(function () {
  'use strict';
  var TT = window.TT;
  var H = TT.h;
  var LS_KEY = 'terraterm.samBase';
  var DEF_BASE = 'http://localhost:8000';

  function base() {
    try { return localStorage.getItem(LS_KEY) || DEF_BASE; } catch (e) { return DEF_BASE; }
  }
  function saveBase(v) {
    try { localStorage.setItem(LS_KEY, v); } catch (e) { /* private mode */ }
  }
  function req(path, init) {
    return fetch(base() + path, init).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
        throw new Error('HTTP ' + r.status + (j.detail ? ' ' + j.detail : ''));
      });
      return r.json();
    });
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function setVal(id, v) { var el = document.getElementById(id); if (el) el.value = v; }
  function setText(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }
  function setCls(id, c) { var el = document.getElementById(id); if (el) el.className = c; }

  function row(label, input, hint) {
    return H('label', { class: 'set-row' },
      H('span', { class: 'set-lab' }, label),
      input,
      hint ? H('span', { class: 'set-note' }, hint) : null);
  }
  function inp(id, type, placeholder) {
    return H('input', { class: 'input', id: id, type: type || 'text', placeholder: placeholder || '', autocomplete: 'off', spellcheck: false });
  }
  function providerSec(title, statusId, fields, testId, resultId) {
    var kids = [H('h3', null, title), H('div', { class: 'set-line' }, H('span', { id: statusId, class: 'set-status' }, '…'))];
    fields.forEach(function (f) { kids.push(f); });
    kids.push(H('div', { class: 'set-line' },
      H('button', { class: 'btn', type: 'button', id: testId }, 'TEST'),
      H('span', { id: resultId, class: 'set-status' }, '')));
    return H('section', { class: 'set-sec' }, kids);
  }

  function refresh() {
    return req('/api/settings').then(function (s) {
      var p = s.providers || {};
      setText('set-st-svc', 'Service reachable · backend ' + (s.backend || '?') + ' (' + (s.backend_source || '?') + ')');
      setCls('set-st-svc', 'set-status set-ok');
      var sam = p.sam || {}, eia = p.eia || {}, cop = p.copernicus || {}, bas = p.baseten || {};
      setText('set-st-sam', sam.configured ? 'SET (' + sam.source + ')' : 'NOT SET');
      setCls('set-st-sam', 'set-status' + (sam.configured ? ' set-ok' : ' set-bad'));
      setText('set-st-eia', eia.configured ? 'SET (' + eia.source + ')' : 'NOT SET');
      setCls('set-st-eia', 'set-status' + (eia.configured ? ' set-ok' : ' set-bad'));
      setText('set-st-cop', (cop.user_configured && cop.configured) ? 'SET (' + cop.source + ')' : 'NOT SET');
      setCls('set-st-cop', 'set-status' + ((cop.user_configured && cop.configured) ? ' set-ok' : ' set-bad'));
      setText('set-st-bas', bas.configured ? 'SET (' + bas.source + ')' : 'NOT SET');
      setCls('set-st-bas', 'set-status' + (bas.configured ? ' set-ok' : ' set-bad'));
      setVal('set-sam-base', sam.sam_base_url || '');
      setVal('set-eia-series', eia.eia_series || '');
      setVal('set-bas-base', bas.baseten_base_url || '');
      setVal('set-bas-model', bas.baseten_model || '');
      var be = document.getElementById('set-backend');
      if (be) be.value = s.backend || 'mock';
      var ps = s.parser || {};
      setText('set-st-parser', ps.parser ? 'Mask decoding ready (node + @meta-sam/parser)' : (ps.node ? 'Parser package missing: run npm install at the repo root' : 'node not found: mask decoding unavailable'));
      setCls('set-st-parser', 'set-status' + (ps.parser ? ' set-ok' : ' set-bad'));
      var ph = function (id, configured) {
        var el = document.getElementById(id);
        if (el) el.placeholder = configured ? 'Saved (type to replace)' : 'Not set';
      };
      ph('set-sam-key', sam.configured);
      ph('set-eia-key', eia.configured);
      ph('set-cop-user', cop.user_configured);
      ph('set-cop-pw', cop.configured);
      ph('set-bas-key', bas.configured);
      return s;
    }).catch(function (e) {
      setText('set-st-svc', 'Service unreachable at ' + base() + ' (' + e.message + '). Start it: uvicorn server:app --port 8000, from services/sam31.');
      setCls('set-st-svc', 'set-status set-bad');
      throw e;
    });
  }

  function save() {
    var body = {};
    var samKey = val('set-sam-key'), eiaKey = val('set-eia-key'), copPw = val('set-cop-pw'), basKey = val('set-bas-key');
    if (samKey) body.sam_api_key = samKey;
    if (eiaKey) body.eia_api_key = eiaKey;
    if (copPw) body.copernicus_password = copPw;
    if (basKey) body.baseten_api_key = basKey;
    var copUser = val('set-cop-user');
    if (copUser) body.copernicus_user = copUser;
    body.sam_base_url = val('set-sam-base');
    body.sam_backend = val('set-backend');
    body.eia_series = val('set-eia-series');
    body.baseten_base_url = val('set-bas-base');
    body.baseten_model = val('set-bas-model');
    return req('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function () {
        ['set-sam-key', 'set-eia-key', 'set-cop-pw', 'set-bas-key'].forEach(function (id) { setVal(id, ''); });
        if (TT.ui && TT.ui.toast) TT.ui.toast('Settings saved on the service machine.');
        return refresh();
      })
      .catch(function (e) { if (TT.ui && TT.ui.toast) TT.ui.toast('Save failed: ' + e.message); });
  }

  function test(provider, resultId, extra) {
    setText(resultId, 'Testing…');
    setCls(resultId, 'set-status');
    var body = { provider: provider };
    if (extra) Object.keys(extra).forEach(function (k) { if (extra[k]) body[k] = extra[k]; });
    return req('/api/settings/test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) {
        setText(resultId, r.ok ? 'OK: ' + r.detail : 'FAILED: ' + r.detail);
        setCls(resultId, 'set-status' + (r.ok ? ' set-ok' : ' set-bad'));
      })
      .catch(function (e) {
        setText(resultId, 'FAILED: ' + e.message);
        setCls(resultId, 'set-status set-bad');
      });
  }

  function clearKeys() {
    if (!window.confirm('Clear all saved API keys from this machine? The app will fall back to mock until keys are added again.')) return;
    req('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sam_api_key: '', eia_api_key: '', copernicus_password: '', baseten_api_key: '' }) })
      .then(function () {
        if (TT.ui && TT.ui.toast) TT.ui.toast('Saved keys cleared.');
        return refresh();
      })
      .catch(function (e) { if (TT.ui && TT.ui.toast) TT.ui.toast('Clear failed: ' + e.message); });
  }

  function open() {
    var backendSel = H('select', { id: 'set-backend' },
      H('option', { value: 'mock' }, 'mock (local/fake, no API calls)'),
      H('option', { value: 'api' }, 'api (hosted Meta Model API, spends calls)'));
    var body = H('div', { class: 'settings' },
      H('div', { class: 'set-line' }, H('span', { id: 'set-st-svc', class: 'set-status' }, '…')),
      H('div', { class: 'set-line' }, H('span', { id: 'set-st-parser', class: 'set-status' }, '…')),
      H('section', { class: 'set-sec' },
        H('h3', null, 'SERVICE'),
        row('Service URL', inp('set-service-url', 'text', DEF_BASE), 'Where the SAM service runs. Stored only in this browser.'),
        H('div', { class: 'set-line' },
          H('button', { class: 'btn', type: 'button', onclick: function () { saveBase(val('set-service-url') || DEF_BASE); refresh().catch(function () {}); } }, 'APPLY URL'))),
      H('section', { class: 'set-sec' },
        H('h3', null, 'BACKEND'),
        row('Segmentation backend', backendSel, 'mock is the default: UI work never accidentally spends API calls or shows mock data as live. Applies immediately, no restart.')),
      providerSec('META MODEL API · SAM 3.1', 'set-st-sam', [
        row('API key', inp('set-sam-key', 'password'), 'Segments tanks from satellite imagery. Get one at dev.meta.ai/api-keys.'),
        row('Base URL', inp('set-sam-base', 'text', 'https://api.meta.ai/v1')),
      ], 'set-test-sam', 'set-res-sam'),
      providerSec('EIA · CUSHING INVENTORY', 'set-st-eia', [
        row('API key', inp('set-eia-key', 'password'), 'Weekly crude stocks at Cushing, OK. Get one at eia.gov/opendata.'),
        row('Series', inp('set-eia-series', 'text', 'W_EPC0_SAX_YCUOK_MBBL')),
      ], 'set-test-eia', 'set-res-eia'),
      providerSec('COPERNICUS · SENTINEL-2 TILES', 'set-st-cop', [
        row('Username (email)', inp('set-cop-user', 'text'), 'Copernicus Data Space account. Tiles over Cushing.'),
        row('Password', inp('set-cop-pw', 'password'), 'Never echoed back. Retype to change.'),
      ], 'set-test-cop', 'set-res-cop'),
      providerSec('BASETEN · MUSE SPARK (AGENT CHAT)', 'set-st-bas', [
        row('API key', inp('set-bas-key', 'password'), 'Chat/reasoning model only. It cannot segment tanks; SAM stays on the Meta API.'),
        row('Base URL', inp('set-bas-base', 'text', 'https://inference.baseten.co/v1')),
        row('Model', inp('set-bas-model', 'text', 'meta-models/muse-spark-open-1026')),
      ], 'set-test-bas', 'set-res-bas'),
      H('div', { class: 'set-actions' },
        H('button', { class: 'btn btn-amber', type: 'button', onclick: save }, 'SAVE SETTINGS'),
        H('button', { class: 'btn', type: 'button', onclick: clearKeys }, 'CLEAR SAVED KEYS')),
      H('p', { class: 'set-note' }, 'Keys are saved to settings.local.json on the service machine (gitignored, mode 0600). They are never committed to git and never stored in this browser. After pulling the repo on a new machine, paste the keys here once and the app runs.'));
    var modal = TT.ui.modal({ title: 'SETTINGS', body: body });
    setVal('set-service-url', base());
    document.getElementById('set-test-sam').addEventListener('click', function () { test('sam', 'set-res-sam', { key: val('set-sam-key') }); });
    document.getElementById('set-test-eia').addEventListener('click', function () { test('eia', 'set-res-eia', { key: val('set-eia-key') }); });
    document.getElementById('set-test-cop').addEventListener('click', function () { test('copernicus', 'set-res-cop', { username: val('set-cop-user'), password: val('set-cop-pw') }); });
    document.getElementById('set-test-bas').addEventListener('click', function () { test('baseten', 'set-res-bas', { key: val('set-bas-key') }); });
    refresh().catch(function () { /* service line already shows the error */ });
    return modal;
  }

  TT.settings = { open: open, base: base };
})();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { TT.boot(); });
  else TT.boot();
</script>
